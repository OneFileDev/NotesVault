function insertImageFile(file, note, bodyEl) {
  if (!file || file.type.indexOf('image/') !== 0) { showToast('Please choose an image file', 'danger'); return; }
  var reader = new FileReader();
  reader.onload = function () {
    var img = new Image();
    img.onload = function () {
      var maxDim = 1200;
      var w = img.width, h = img.height;
      if (w > maxDim || h > maxDim) {
        if (w >= h) { h = Math.round(h * maxDim / w); w = maxDim; }
        else { w = Math.round(w * maxDim / h); h = maxDim; }
      }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      var dataUrl = canvas.toDataURL('image/jpeg', 0.8);
      var approxBytes = Math.round(dataUrl.length * 0.75);
      if (approxBytes > 900000) {
        showToast('That image is quite large even after compression — consider resizing it first', 'info');
      }
      var beforeSelection = getEditorSelectionSnapshot(bodyEl);
      bodyEl.focus();
      document.execCommand('insertHTML', false, '<img src="' + dataUrl + '" class="note-image" alt="Image"><div><br></div>');
      recordEditorHistoryChange(note, bodyEl, beforeSelection);
      note.body = serializeEditorBody(bodyEl);
      scheduleSave(note);
    };
    img.onerror = function () { showToast('Could not read that image', 'danger'); };
    img.src = reader.result;
  };
  reader.onerror = function () { showToast('Could not read that image', 'danger'); };
  reader.readAsDataURL(file);
}

/* Markdown export — walks the note's own limited HTML vocabulary (this editor's
   output only, not arbitrary HTML) rather than using a general converter. */
function inlineMarkdown(node) {
  if (node.nodeType === 3) return node.textContent;
  if (node.nodeType !== 1) return '';
  var tag = node.tagName.toLowerCase();
  if (tag === 'img') return '![Image](' + (node.getAttribute('src') || '') + ')';
  if (tag === 'br') return '\n';
  if (tag === 'input') return '';
  var inner = Array.prototype.map.call(node.childNodes, inlineMarkdown).join('');
  if (tag === 'b' || tag === 'strong') return inner.trim() ? '**' + inner + '**' : inner;
  if (tag === 'i' || tag === 'em') return inner.trim() ? '*' + inner + '*' : inner;
  return inner;
}
function blockToMarkdown(node) {
  if (node.nodeType === 3) { var t = node.textContent.trim(); return t || null; }
  if (node.nodeType !== 1) return null;
  var tag = node.tagName.toLowerCase();
  if (tag === 'h2') return '## ' + inlineMarkdown(node).trim();
  if (tag === 'h3') return '### ' + inlineMarkdown(node).trim();
  if (tag === 'ul') return Array.prototype.map.call(node.children, function (li) { return '- ' + inlineMarkdown(li).trim(); }).join('\n');
  if (tag === 'ol') return Array.prototype.map.call(node.children, function (li, i) { return (i + 1) + '. ' + inlineMarkdown(li).trim(); }).join('\n');
  if (tag === 'pre') return '```\n' + node.textContent.replace(/\n$/, '') + '\n```';
  if (tag === 'img') return '![Image](' + (node.getAttribute('src') || '') + ')';
  if (node.classList && node.classList.contains('checklist-item')) {
    var checkbox = node.querySelector('input[type="checkbox"]');
    var checked = checkbox && checkbox.checked;
    return '- [' + (checked ? 'x' : ' ') + '] ' + inlineMarkdown(node).trim();
  }
  if (tag === 'div' || tag === 'p') { var text = inlineMarkdown(node).trim(); return text || null; }
  var fallback = inlineMarkdown(node).trim();
  return fallback || null;
}
function htmlToMarkdown(html) {
  var container = document.createElement('div');
  container.innerHTML = html || '';
  var blocks = [], buffer = [];
  function flushBuffer() { if (buffer.length) { blocks.push(buffer.join('\n')); buffer = []; } }
  Array.prototype.forEach.call(container.childNodes, function (node) {
    if (node.nodeType === 1 && node.classList && node.classList.contains('checklist-item')) {
      var checkbox = node.querySelector('input[type="checkbox"]');
      var checked = checkbox && checkbox.checked;
      buffer.push('- [' + (checked ? 'x' : ' ') + '] ' + inlineMarkdown(node).trim());
      return;
    }
    flushBuffer();
    var b = blockToMarkdown(node);
    if (b) blocks.push(b);
  });
  flushBuffer();
  return blocks.join('\n\n').trim();
}
function exportNoteAsMarkdown(note) {
  var md = '';
  if (note.title && note.title.trim()) md += '# ' + note.title.trim() + '\n\n';
  md += htmlToMarkdown(note.body);
  var blob = new Blob([md], { type: 'text/markdown' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var safeName = (note.title && note.title.trim() ? note.title.trim() : 'untitled-note').replace(/[\\/:*?"<>|]/g, '-').slice(0, 80);
  a.href = url; a.download = safeName + '.md';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast('Note exported as Markdown', 'success');
}

/* Markdown-style shortcuts: typing a trigger + space at the very start of a text
   node converts the block. Fails safe — if anything doesn't match exactly, the
   space is typed normally with no side effects. */
function handleMarkdownShortcut(e, note, bodyEl) {
  if (e.key !== ' ') return;
  var sel = window.getSelection();
  if (!sel || !sel.rangeCount) return;
  var range = sel.getRangeAt(0);
  if (!range.collapsed) return;
  var node = range.startContainer;
  if (node.nodeType !== 3) return;
  var textBefore = node.textContent.slice(0, range.startOffset);
  var trigger = null, type = null;
  if (textBefore === '#') { trigger = '#'; type = 'h2'; }
  else if (textBefore === '##') { trigger = '##'; type = 'h3'; }
  else if (textBefore === '-' || textBefore === '*') { trigger = textBefore; type = 'ul'; }
  else if (/^\d+\.$/.test(textBefore)) { trigger = textBefore; type = 'ol'; }
  else if (textBefore === '[]' || textBefore === '[ ]') { trigger = textBefore; type = 'checklist'; }
  if (!type) return;

  e.preventDefault();
  var start = range.startOffset - trigger.length;
  node.textContent = node.textContent.slice(0, start) + node.textContent.slice(range.startOffset);
  var newRange = document.createRange();
  newRange.setStart(node, start);
  newRange.setEnd(node, start);
  sel.removeAllRanges();
  sel.addRange(newRange);

  if (type === 'h2' || type === 'h3') document.execCommand('formatBlock', false, type);
  else if (type === 'ul') document.execCommand('insertUnorderedList', false, null);
  else if (type === 'ol') document.execCommand('insertOrderedList', false, null);
  else if (type === 'checklist') insertChecklistItem();

  recordEditorHistoryChange(note, bodyEl, getEditorSelectionSnapshot(bodyEl));
  note.body = serializeEditorBody(bodyEl);
  scheduleSave(note);
}

function scheduleSave(note) {

  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(function () { flushPendingSave(false); }, 500);
}
function flushPendingSave(sync) {
  if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
  if (pendingNote) {
    var note = pendingNote;
    pendingNote = null;
    persistNoteImmediate(note);
    var timestampsEl = $('#editor-timestamps');
    if (timestampsEl && note.id === selectedNoteId) {
      timestampsEl.textContent = 'Created ' + formatDateTime(note.createdAt) + ' · Edited ' + formatDateTime(note.modifiedAt);
    }
    renderNotesList();
  }
}
function persistNoteImmediate(note) {

    return saveNoteRecord({ id: note.id, iv: enc.iv, cipher: enc.cipher });
  }).catch(function () { showToast('Could not save note', 'danger'); });
}

function purgeExpiredTrash() {
  var cutoff = Date.now() - TRASH_RETENTION_DAYS * 86400000;
  var toRemove = notes.filter(function (n) { return n.deleted && n.deletedAt && n.deletedAt < cutoff; });
  if (!toRemove.length) return;
  notes = notes.filter(function (n) { return !(n.deleted && n.deletedAt && n.deletedAt < cutoff); });
  toRemove.forEach(function (n) { deleteNoteRecord(n.id); });
}
function renderTrashList() {
  var container = $('#trash-list');
  var trashed = notes.filter(function (n) { return n.deleted; }).sort(function (a, b) { return (b.deletedAt || 0) - (a.deletedAt || 0); });
  if (trashed.length === 0) {
    container.innerHTML = '<div class="empty-state"><i data-lucide="trash-2"></i><p>Trash is empty.</p></div>';
    icons();
    return;
  }
  container.innerHTML = trashed.map(function (n) {
    var title = n.title && n.title.trim() ? escapeHtml(n.title) : 'Untitled note';
    var dLeft = daysLeft(n.deletedAt);
    return (
      '<div class="trash-item" data-id="' + n.id + '">' +
        '<div class="trash-item-main">' +
          '<div class="trash-item-title">' + title + '</div>' +
          '<div class="trash-item-meta">Deleted ' + formatDate(n.deletedAt) + ' · purges in ' + dLeft + ' day' + (dLeft === 1 ? '' : 's') + '</div>' +
        '</div>' +
        '<div class="trash-item-actions">' +
          '<button class="btn btn-ghost" data-restore="' + n.id + '"><i data-lucide="rotate-ccw"></i>Restore</button>' +
          '<button class="btn btn-danger-ghost" data-purge="' + n.id + '"><i data-lucide="x"></i>Delete Forever</button>' +
        '</div>' +
      '</div>'
    );
  }).join('');
  icons();
  $all('[data-restore]', container).forEach(function (btn) { on(btn, 'click', function () { restoreNote(btn.getAttribute('data-restore')); }); });
  $all('[data-purge]', container).forEach(function (btn) { on(btn, 'click', function () { confirmPurgeNote(btn.getAttribute('data-purge')); }); });
}
function restoreNote(id) {
  var n = findNote(id);
  if (!n) return;
  n.deleted = false;
  n.deletedAt = null;
  persistNoteImmediate(n);
  renderTrashList();
  renderNotesList();
  updateTrashBadge();
  showToast('Note restored', 'success');
}
function confirmPurgeNote(id) {
  var n = findNote(id);
  if (!n) return;
  showConfirm({
    title: 'Delete forever?',
    message: '"' + (n.title || 'Untitled note') + '" will be permanently deleted. This cannot be undone.',
    confirmLabel: 'Delete Forever', danger: true,
    onConfirm: function () {
      notes = notes.filter(function (x) { return x.id !== id; });
      deleteNoteRecord(id);
      renderTrashList();
      updateTrashBadge();
      showToast('Note permanently deleted', 'success');
    }
  });
}
on($('#empty-trash-btn'), 'click', function () {
  var trashed = notes.filter(function (n) { return n.deleted; });
  if (!trashed.length) { showToast('Trash is already empty', 'info'); return; }
  showConfirm({
    title: 'Empty Trash?',
    message: trashed.length + ' note' + (trashed.length === 1 ? '' : 's') + ' will be permanently deleted. This cannot be undone.',
    confirmLabel: 'Empty Trash', danger: true,
    onConfirm: function () {
      trashed.forEach(function (n) { deleteNoteRecord(n.id); });
      notes = notes.filter(function (n) { return !n.deleted; });
      renderTrashList();
      updateTrashBadge();
      showToast('Trash emptied', 'success');
    }
  });
});

async function handleChangePassword(e) {
  e.preventDefault();
  var currentField = $('#cp-current');
  var current = currentField ? currentField.value : null;
  var next = $('#cp-new').value, confirm = $('#cp-confirm').value;
  var errEl = $('#cp-error');
  errEl.textContent = '';
  if (next.length < 8) { errEl.textContent = 'New password must be at least 8 characters.'; return; }
  if (next !== confirm) { errEl.textContent = "New passwords don't match."; return; }

  var submitBtn = $('#cp-submit');
  submitBtn.disabled = true; submitBtn.textContent = 'Verifying…';
  var config = await getVaultConfig();
  if (!recoveryModeActive) {
    try {
      var saltCurrent = b64ToBuf(config.saltPassword);
      var kekCurrent = await deriveKEK(current, saltCurrent, config.iterations);
      await unwrapDEK(config.wrappedDekPassword, config.wrappedDekPasswordIv, kekCurrent);
    } catch (err) {
      errEl.textContent = 'Current password is incorrect.';
      submitBtn.disabled = false; submitBtn.textContent = 'Change Password';
      return;
    }
  }

  submitBtn.textContent = 'Saving…';
  var newSalt = crypto.getRandomValues(new Uint8Array(16));
  var newKek = await deriveKEK(next, newSalt, PBKDF2_ITERATIONS);
  var newWrapped = await wrapDEK(vaultKey, newKek);
  config.saltPassword = bufToB64(newSalt);
  config.iterations = PBKDF2_ITERATIONS;
  config.wrappedDekPasswordIv = newWrapped.iv;
  config.wrappedDekPassword = newWrapped.wrapped;
  await setVaultConfig(config);
  logActivity('password-changed');

  var wasRecovery = recoveryModeActive;
  recoveryModeActive = false;
  changePasswordOpen = false;
  showToast('Master password changed', 'success');
  if (wasRecovery) switchTab('notes'); else renderSettings();
}

async function handleGenerateRecoveryKey() {
  var btn = $('#generate-recovery-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Generating…'; }
  try {
    var recoveryKey = generateRecoveryKey();
    var normalized = normalizeRecoveryInput(recoveryKey);
    var saltRecovery = crypto.getRandomValues(new Uint8Array(16));
    var recoveryIterations = PBKDF2_ITERATIONS;
    var kek = await deriveKEK(normalized, saltRecovery, recoveryIterations);
    var wrapped = await wrapDEK(vaultKey, kek);

    /* Do not persist anything until the user confirms they saved the key.
       This makes Cancel a true no-op instead of silently enabling recovery. */
    showRecoveryKeyModal(recoveryKey, async function () {
      var config = await getVaultConfig();
      config.recoveryEnabled = true;
      config.saltRecovery = bufToB64(saltRecovery);
      config.iterationsRecovery = recoveryIterations;
      config.wrappedDekRecoveryIv = wrapped.iv;
      config.wrappedDekRecovery = wrapped.wrapped;
      await setVaultConfig(config);
      recoveryAvailable = true;
      logActivity('recovery-key-generated');
      renderSettings();
    }, function () {
      renderSettings();
    });
  } catch (err) {
    showToast('Could not generate a recovery key', 'danger');
    if (btn) { btn.disabled = false; btn.textContent = 'Generate Recovery Key'; }
  }
}

function handleRevokeRecoveryKey() {
  showConfirm({
    title: 'Revoke recovery key?',
    message: 'Your current recovery key will stop working immediately. You can generate a new one anytime.',
    confirmLabel: 'Revoke', danger: true,
    onConfirm: async function () {
      var config = await getVaultConfig();
      config.recoveryEnabled = false;
      config.saltRecovery = null; config.wrappedDekRecoveryIv = null; config.wrappedDekRecovery = null; config.iterationsRecovery = null;
      await setVaultConfig(config);
      recoveryAvailable = false;
      logActivity('recovery-key-revoked');

  });
}

/* ---- Activity log display helpers ---- */
function activityIcon(event) {
  var map = {
    unlock: 'log-in', lock: 'log-out', 'vault-created': 'sparkles', 'password-changed': 'key-round',
    'recovery-key-generated': 'shield-check', 'recovery-key-revoked': 'shield-off',
    'biometric-enabled': 'fingerprint', 'biometric-revoked': 'fingerprint', 'backup-exported': 'download'
  };
  return map[event] || 'circle';
}
function activityLabel(a) {
  var d = a.detail || {};
  switch (a.event) {
    case 'unlock': return 'Unlocked via ' + (d.method === 'password' ? 'password' : d.method === 'recovery' ? 'recovery key' : 'biometrics');
    case 'lock': return 'Locked (' + (d.reason === 'idle' ? 'inactivity' : d.reason === 'blur' ? 'switched away' : d.reason === 'import' ? 'vault imported' : 'manual') + ')';
    case 'vault-created': return 'Vault created';
    case 'password-changed': return 'Master password changed';
    case 'recovery-key-generated': return 'Recovery key generated';
    case 'recovery-key-revoked': return 'Recovery key revoked';
    case 'biometric-enabled': return 'Biometric unlock enabled';
    case 'biometric-revoked': return 'Biometric unlock turned off';
    case 'backup-exported': return 'Backup exported';
    default: return a.event;
  }
}

function showRecoveryKeyModal(key, onConfirm, onCancel) {
  var root = $('#modal-root');
  root.innerHTML =
    '<div class="modal-backdrop" id="rk-backdrop">' +
      '<div class="modal" role="dialog" aria-modal="true" style="max-width:440px;">' +
        '<h3 class="modal-title">Your Recovery Key</h3>' +
        '<p class="modal-message">Save this somewhere safe — a password manager, or printed and stored securely. It\'s the only way back into your notes if you forget your master password, and it will not be shown again.</p>' +
        '<div class="recovery-key-box" id="recovery-key-box">' + escapeHtml(key) + '</div>' +
        '<button class="btn btn-ghost btn-block" id="rk-copy-btn" style="margin-bottom:var(--space-4);"><i data-lucide="copy"></i>Copy to clipboard</button>' +
        '<label class="rk-confirm-row"><input type="checkbox" id="rk-ack">I\'ve saved my recovery key somewhere safe</label>' +
        '<div style="display:flex;gap:var(--space-3);">' +
          '<button class="btn btn-ghost" id="rk-cancel-btn" style="flex:1;">Cancel</button>' +
          '<button class="btn btn-primary" id="rk-done-btn" style="flex:1;" disabled>Done</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  icons();
  var ack = $('#rk-ack'), doneBtn = $('#rk-done-btn'), cancelBtn = $('#rk-cancel-btn');
  var finished = false;
  on(ack, 'change', function () { doneBtn.disabled = !ack.checked; });
  on($('#rk-copy-btn'), 'click', function () {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(key).then(function () { showToast('Recovery key copied', 'success'); })
        .catch(function () { showToast('Could not copy — please select and copy manually', 'danger'); });
    } else {
      showToast('Could not copy — please select and copy manually', 'danger');
    }
  });
  on(cancelBtn, 'click', function () {
    if (finished) return;
    finished = true;
    closeModalRoot(root);
    if (onCancel) onCancel();
  });
  on(doneBtn, 'click', async function () {
    if (finished || !ack.checked) return;
    finished = true;
    doneBtn.disabled = true;
    cancelBtn.disabled = true;
    doneBtn.textContent = 'Saving…';
    try {
      if (onConfirm) await onConfirm();
      closeModalRoot(root);
    } catch (err) {
      finished = false;
      doneBtn.disabled = false;
      cancelBtn.disabled = false;
      doneBtn.textContent = 'Done';
      showToast('Could not save the recovery key', 'danger');
    }
  });
}

function showEraseAllDataModal() {
  var root = $('#modal-root');
  root.innerHTML =
    '<div class="modal-backdrop" id="erase-backdrop">' +
      '<div class="modal" role="dialog" aria-modal="true">' +
        '<h3 class="modal-title">Erase All Data</h3>' +
        '<p class="modal-message">This permanently deletes your entire vault — every note, your master password, and any recovery key — from this device. There is no undo.</p>' +
        '<div class="field password-field">' +
          '<label for="erase-password">Master password</label>' +
          '<div class="password-field-inner"><input type="password" id="erase-password" autocomplete="current-password"></div>' +
        '</div>' +
        '<div class="field">' +
          '<label for="erase-confirm-text">Type DELETE to confirm</label>' +
          '<input type="text" id="erase-confirm-text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="DELETE">' +
        '</div>' +
        '<p class="field-error" id="erase-error"></p>' +
        '<div class="modal-actions">' +
          '<button class="btn btn-ghost" id="erase-cancel-btn">Cancel</button>' +
          '<button class="btn btn-danger" id="erase-confirm-btn" disabled>Erase Everything</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  icons();
  var pwField = $('#erase-password'), textField = $('#erase-confirm-text'), confirmBtn = $('#erase-confirm-btn'), errEl = $('#erase-error');
  function updateBtnState() {
    confirmBtn.disabled = !(pwField.value.length > 0 && textField.value.trim().toUpperCase() === 'DELETE');
  }
  on(pwField, 'input', updateBtnState);
  on(textField, 'input', updateBtnState);
  function close() { closeModalRoot(root); }
  on($('#erase-cancel-btn'), 'click', close);
  on($('#erase-backdrop'), 'click', function (e) { if (e.target.id === 'erase-backdrop') close(); });
  on(confirmBtn, 'click', async function () {
    errEl.textContent = '';
    confirmBtn.disabled = true; confirmBtn.textContent = 'Erasing…';
    try {
      var config = await getVaultConfig();
      if (!config) throw new Error('no-vault');
      var salt = b64ToBuf(config.saltPassword);
      var kek = await deriveKEK(pwField.value, salt, config.iterations);
      await unwrapDEK(config.wrappedDekPassword, config.wrappedDekPasswordIv, kek); // throws if the password is wrong

      await clearAllStorage();
      close();
      vaultKey = null; notes = []; selectedNoteId = null;
      folders = []; activityLog = []; currentFolderId = 'all'; activeTagFilters = [];
      selectMode = false; selectedNoteIds = [];
      recoveryAvailable = false; recoveryModeActive = false; changePasswordOpen = false; biometricAvailable = false;
      stopIdleTimer();
      $('#app-shell').hidden = true;
      $('#lock-screen').classList.remove('hidden');
      renderLockScreen('setup');
      showToast('All data erased from this device', 'success');
    } catch (err) {
      confirmBtn.disabled = false; confirmBtn.textContent = 'Erase Everything';
      errEl.textContent = 'Incorrect password.';
    }
  });
}

/* Export / Import */
async function exportBackup() {
  var config = await getVaultConfig();
  var rawNotes = await getAllNoteRecords();
  var payload = { app: 'NotesVault', version: APP_VERSION, exportedAt: new Date().toISOString(), vault: config, notes: rawNotes };
  var blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var stamp = new Date().toISOString().slice(0, 10);
  a.href = url; a.download = 'notesvault-backup-' + stamp + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  logActivity('backup-exported');
  showToast('Backup exported', 'success');
}
on($('#import-file-input'), 'change', function (e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function () {
    var parsed;
    try { parsed = JSON.parse(reader.result); } catch (err) { showToast('That file is not a valid NotesVault backup', 'danger'); return; }
    if (!parsed || !parsed.vault || !parsed.vault.saltPassword || !Array.isArray(parsed.notes)) {
      showToast('That file is not a valid NotesVault backup', 'danger'); return;
    }
    showConfirm({
      title: 'Replace current vault?',
      message: 'Importing this backup will replace everything currently in your vault. This cannot be undone.',
      confirmLabel: 'Import & Replace', danger: true,
      onConfirm: function () { performImport(parsed); }
    });
  };
  reader.readAsText(file);
  e.target.value = '';
});
async function performImport(parsed) {
  await replaceAllStorage(parsed.vault, parsed.notes);
  vaultKey = null; // must be cleared before lockVault(), or it would try to encrypt a
                    // lock-event with the OLD key and write it into the NEW imported config
  recoveryAvailable = !!parsed.vault.recoveryEnabled;
  biometricAvailable = !!parsed.vault.biometricEnabled;
  showToast('Vault imported', 'success');
  lockVault('import');
  renderLockScreen('imported');
}

   SIDEBAR
   ============================================================ */
function toggleSidebarFold() {
  prefs.sidebarCollapsed = !prefs.sidebarCollapsed;
  savePrefs();
  $('#sidebar').classList.toggle('collapsed', prefs.sidebarCollapsed);
}
function openMobileSidebar() {
  $('#sidebar').classList.add('mobile-open');
  $('#sidebar-backdrop').classList.add('show');
}
function closeMobileSidebar() {
  $('#sidebar').classList.remove('mobile-open');
  $('#sidebar-backdrop').classList.remove('show');
}

/* ============================================================
   GLOBAL EVENT BINDING
   ============================================================ */
function bindGlobalEvents() {
  $all('.nav-item').forEach(function (btn) { on(btn, 'click', function () { switchTab(btn.getAttribute('data-tab')); }); });
  on($('#new-note-btn'), 'click', createNewNote);
  on($('#select-mode-btn'), 'click', toggleSelectMode);
  on($('#fold-btn'), 'click', toggleSidebarFold);
  on($('#menu-btn'), 'click', openMobileSidebar);
  on($('#sidebar-backdrop'), 'click', closeMobileSidebar);
  on($('#settings-btn'), 'click', function () { switchTab('settings'); });
  on($('#theme-toggle-btn'), 'click', cycleTheme);
  on($('#lock-btn'), 'click', function () { lockVault('manual'); });
  on($('#editor-image-input'), 'change', function (e) {
    var file = e.target.files[0];
    if (file && pendingImageTarget) insertImageFile(file, pendingImageTarget.note, pendingImageTarget.bodyEl);
    pendingImageTarget = null;
    e.target.value = '';
  });

  on(document, 'keydown', function (e) {
    if (e.key === 'Escape') {
      if (wikiAutocompleteState.open) { closeWikiAutocomplete(); return; }
      if (commandPaletteOpen) { closeCommandPalette(); return; }
      if (openTagPopoverNoteId) { var n = findNote(openTagPopoverNoteId); openTagPopoverNoteId = null; if (n) renderEditorTags(n); }
      if (openFolderPickerNoteId) { var n2 = findNote(openFolderPickerNoteId); openFolderPickerNoteId = null; if (n2) renderEditorTags(n2); }
      closeModalRoot($('#modal-root'));
    }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      if (vaultKey) showCommandPalette();
    }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'n') {
      if (vaultKey && !commandPaletteOpen) { e.preventDefault(); switchTab('notes'); createNewNote(); }
    }
  });

  on(document, 'click', function (e) {
    var pop = $('#image-resize-popover');
    if (!pop || pop.hidden) return;
    if (e.target.closest && (e.target.closest('#image-resize-popover') || e.target.closest('.note-image') || e.target.closest('#editor-image-resize-btn'))) return;
    closeImageResizePopover(true);
  });
  window.addEventListener('resize', function () {
    if ($('#image-resize-popover') && !$('#image-resize-popover').hidden) positionImageResizePopover();
    if (wikiAutocompleteState.open) positionWikiAutocomplete();
  });
  window.addEventListener('scroll', function () {
    if ($('#image-resize-popover') && !$('#image-resize-popover').hidden) positionImageResizePopover();
    if (wikiAutocompleteState.open) positionWikiAutocomplete();
  }, true);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', function () { if (wikiAutocompleteState.open) positionWikiAutocomplete(); });
    window.visualViewport.addEventListener('scroll', function () { if (wikiAutocompleteState.open) positionWikiAutocomplete(); });
  }

  window.addEventListener('beforeunload', function () { flushPendingSave(true); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) flushPendingSave(true); });
  window.addEventListener('pagehide', function () { flushPendingSave(true); });
}

init();
})();
</script>
