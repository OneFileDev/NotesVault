  $all('.segmented-btn[data-amoled-choice]', el).forEach(function (b) {
    on(b, 'click', function () { setAmoledAccent(b.getAttribute('data-amoled-choice')); });
  });
}

async function handleChangePassword(e) {
  e.preventDefault();
  var currentField = $('#cp-current');
  var current = currentField ? currentField.value : null;
  var next = $('#cp-new').value, confirm = $('#cp-confirm').value;
  var errEl = $('#cp-error');
  errEl.textContent = '';
  if (next.length < 8) { errEl.textContent = 'New password must be at least 8 characters.'; return; }
  if (next !== confirm) { errEl.textContent = "New passwords don't match."; return; }

  var submitBtn = $('#cp-submit');
  submitBtn.disabled = true; submitBtn.textContent = 'Verifying…';
  var config = await getVaultConfig();
  if (!recoveryModeActive) {
    try {
      var saltCurrent = b64ToBuf(config.saltPassword);
      var kekCurrent = await deriveKEK(current, saltCurrent, config.iterations);
      await unwrapDEK(config.wrappedDekPassword, config.wrappedDekPasswordIv, kekCurrent);
    } catch (err) {
      errEl.textContent = 'Current password is incorrect.';
      submitBtn.disabled = false; submitBtn.textContent = 'Change Password';
      return;
    }
  }

  submitBtn.textContent = 'Saving…';
  var newSalt = crypto.getRandomValues(new Uint8Array(16));
  var newKek = await deriveKEK(next, newSalt, PBKDF2_ITERATIONS);
  var newWrapped = await wrapDEK(vaultKey, newKek);
  config.saltPassword = bufToB64(newSalt);
  config.iterations = PBKDF2_ITERATIONS;
  config.wrappedDekPasswordIv = newWrapped.iv;
  config.wrappedDekPassword = newWrapped.wrapped;
  await setVaultConfig(config);
  logActivity('password-changed');

  var wasRecovery = recoveryModeActive;
  recoveryModeActive = false;
  changePasswordOpen = false;
  showToast('Master password changed', 'success');
  if (wasRecovery) switchTab('notes'); else renderSettings();
}

async function handleGenerateRecoveryKey() {
  var btn = $('#generate-recovery-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Generating…'; }
  var recoveryKey = generateRecoveryKey();
  var normalized = normalizeRecoveryInput(recoveryKey);
  var saltRecovery = crypto.getRandomValues(new Uint8Array(16));
  var kek = await deriveKEK(normalized, saltRecovery, PBKDF2_ITERATIONS);
  var wrapped = await wrapDEK(vaultKey, kek);
  var config = await getVaultConfig();
  config.recoveryEnabled = true;
  config.saltRecovery = bufToB64(saltRecovery);
  config.wrappedDekRecoveryIv = wrapped.iv;
  config.wrappedDekRecovery = wrapped.wrapped;
  await setVaultConfig(config);
  recoveryAvailable = true;
  logActivity('recovery-key-generated');
  renderSettings();
  showRecoveryKeyModal(recoveryKey);
}

function handleRevokeRecoveryKey() {
  showConfirm({
    title: 'Revoke recovery key?',
    message: 'Your current recovery key will stop working immediately. You can generate a new one anytime.',
    confirmLabel: 'Revoke', danger: true,
    onConfirm: async function () {
      var config = await getVaultConfig();
      config.recoveryEnabled = false;
      config.saltRecovery = null; config.wrappedDekRecoveryIv = null; config.wrappedDekRecovery = null;
      await setVaultConfig(config);
      recoveryAvailable = false;
      logActivity('recovery-key-revoked');
      showToast('Recovery key revoked', 'success');
      renderSettings();
    }
  });
}

/* ---- Biometric unlock (Settings UI) ---- */
function renderBiometricBlock() {
  webAuthnPlatformAvailable().then(function (ok) {
    var block = $('#biometric-block');
    if (!block) return; // navigated away before this resolved
    if (!ok) {
      block.innerHTML =
        '<div class="setting-row-label" style="margin-bottom:4px;">Biometric Unlock</div>' +
        '<p class="setting-row-desc">Not available on this device or browser.</p>';
      return;
    }
    block.innerHTML =
      '<div class="setting-row-label" style="margin-bottom:4px;">Biometric Unlock</div>' +
      '<p class="setting-row-desc" style="margin-bottom:var(--space-3);">' +
        (biometricAvailable
          ? "Enabled. You can unlock with this device's Face ID, Touch ID, or Windows Hello, alongside your password."
          : "Optional. Add this device's Face ID, Touch ID, or Windows Hello as a quick way to unlock, alongside your password.") +
      '</p>' +
      (biometricAvailable
        ? '<button class="btn btn-danger-ghost" id="revoke-biometric-btn"><i data-lucide="shield-off"></i>Turn Off Biometric Unlock</button>'
        : '<button class="btn btn-ghost" id="enable-biometric-btn"><i data-lucide="fingerprint"></i>Enable Biometric Unlock</button>');
    icons();
    on($('#enable-biometric-btn'), 'click', handleEnableBiometric);
    on($('#revoke-biometric-btn'), 'click', handleRevokeBiometric);
  });
}
async function handleEnableBiometric() {
  var btn = $('#enable-biometric-btn');
  setBtnLoading(btn, 'Waiting for biometric…');
  try {
    var result = await enrollBiometricCredential();
    var kek = await kekFromRawBytes(result.secretBytes);
    var wrapped = await wrapDEK(vaultKey, kek);
    var config = await getVaultConfig();
    config.biometricEnabled = true;
    config.biometricCredentialId = result.credentialId;
    config.wrappedDekBiometricIv = wrapped.iv;
    config.wrappedDekBiometric = wrapped.wrapped;
    await setVaultConfig(config);
    biometricAvailable = true;
    logActivity('biometric-enabled');
    showToast('Biometric unlock enabled', 'success');
    renderSettings();
  } catch (err) {
    showToast('Could not enable biometric unlock on this device', 'danger');
    if (btn) { btn.disabled = false; btn.textContent = 'Enable Biometric Unlock'; }
  }
}
function handleRevokeBiometric() {
  showConfirm({
    title: 'Turn off biometric unlock?',
    message: 'You can always set it up again later. Your password and recovery key are unaffected.',
    confirmLabel: 'Turn Off', danger: true,
    onConfirm: async function () {
      var config = await getVaultConfig();
      config.biometricEnabled = false; config.biometricCredentialId = null;
      config.wrappedDekBiometricIv = null; config.wrappedDekBiometric = null;
      await setVaultConfig(config);
      biometricAvailable = false;
      logActivity('biometric-revoked');
      showToast('Biometric unlock turned off', 'success');
      renderSettings();
    }
  });
}

/* ---- Activity log display helpers ---- */
function activityIcon(event) {
  var map = {
    unlock: 'log-in', lock: 'log-out', 'vault-created': 'sparkles', 'password-changed': 'key-round',
    'recovery-key-generated': 'shield-check', 'recovery-key-revoked': 'shield-off',
    'biometric-enabled': 'fingerprint', 'biometric-revoked': 'fingerprint', 'backup-exported': 'download'
  };
  return map[event] || 'circle';
}
function activityLabel(a) {
  var d = a.detail || {};
  switch (a.event) {
    case 'unlock': return 'Unlocked via ' + (d.method === 'password' ? 'password' : d.method === 'recovery' ? 'recovery key' : 'biometrics');
    case 'lock': return 'Locked (' + (d.reason === 'idle' ? 'inactivity' : d.reason === 'blur' ? 'switched away' : d.reason === 'import' ? 'vault imported' : 'manual') + ')';
    case 'vault-created': return 'Vault created';
    case 'password-changed': return 'Master password changed';
    case 'recovery-key-generated': return 'Recovery key generated';
    case 'recovery-key-revoked': return 'Recovery key revoked';
    case 'biometric-enabled': return 'Biometric unlock enabled';
    case 'biometric-revoked': return 'Biometric unlock turned off';
    case 'backup-exported': return 'Backup exported';
    default: return a.event;
  }
}

function showRecoveryKeyModal(key) {
  var root = $('#modal-root');
  root.innerHTML =
    '<div class="modal-backdrop" id="rk-backdrop">' +
      '<div class="modal" role="dialog" aria-modal="true" style="max-width:440px;">' +
        '<h3 class="modal-title">Your Recovery Key</h3>' +
        '<p class="modal-message">Save this somewhere safe — a password manager, or printed and stored securely. It\'s the only way back into your notes if you forget your master password, and it will not be shown again.</p>' +
        '<div class="recovery-key-box" id="recovery-key-box">' + escapeHtml(key) + '</div>' +
        '<button class="btn btn-ghost btn-block" id="rk-copy-btn" style="margin-bottom:var(--space-4);"><i data-lucide="copy"></i>Copy to clipboard</button>' +
        '<label class="rk-confirm-row"><input type="checkbox" id="rk-ack">I\'ve saved my recovery key somewhere safe</label>' +
        '<button class="btn btn-primary btn-block" id="rk-done-btn" disabled>Done</button>' +
      '</div>' +
    '</div>';
  icons();
  var ack = $('#rk-ack'), doneBtn = $('#rk-done-btn');
  on(ack, 'change', function () { doneBtn.disabled = !ack.checked; });
  on($('#rk-copy-btn'), 'click', function () {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(key).then(function () { showToast('Recovery key copied', 'success'); })
        .catch(function () { showToast('Could not copy — please select and copy manually', 'danger'); });
    } else {
      showToast('Could not copy — please select and copy manually', 'danger');
    }
  });
  on(doneBtn, 'click', function () { closeModalRoot(root); });
}

function showEraseAllDataModal() {
  var root = $('#modal-root');
  root.innerHTML =
    '<div class="modal-backdrop" id="erase-backdrop">' +
      '<div class="modal" role="dialog" aria-modal="true">' +
        '<h3 class="modal-title">Erase All Data</h3>' +
        '<p class="modal-message">This permanently deletes your entire vault — every note, your master password, and any recovery key — from this device. There is no undo.</p>' +
        '<div class="field password-field">' +
          '<label for="erase-password">Master password</label>' +
          '<div class="password-field-inner"><input type="password" id="erase-password" autocomplete="current-password"></div>' +
        '</div>' +
        '<div class="field">' +
          '<label for="erase-confirm-text">Type DELETE to confirm</label>' +
          '<input type="text" id="erase-confirm-text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="DELETE">' +
        '</div>' +
        '<p class="field-error" id="erase-error"></p>' +
        '<div class="modal-actions">' +
          '<button class="btn btn-ghost" id="erase-cancel-btn">Cancel</button>' +
          '<button class="btn btn-danger" id="erase-confirm-btn" disabled>Erase Everything</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  icons();
  var pwField = $('#erase-password'), textField = $('#erase-confirm-text'), confirmBtn = $('#erase-confirm-btn'), errEl = $('#erase-error');
  function updateBtnState() {
    confirmBtn.disabled = !(pwField.value.length > 0 && textField.value.trim().toUpperCase() === 'DELETE');
  }
  on(pwField, 'input', updateBtnState);
  on(textField, 'input', updateBtnState);
  function close() { closeModalRoot(root); }
  on($('#erase-cancel-btn'), 'click', close);
  on($('#erase-backdrop'), 'click', function (e) { if (e.target.id === 'erase-backdrop') close(); });
  on(confirmBtn, 'click', async function () {
    errEl.textContent = '';
    confirmBtn.disabled = true; confirmBtn.textContent = 'Erasing…';
    try {
      var config = await getVaultConfig();
      if (!config) throw new Error('no-vault');
      var salt = b64ToBuf(config.saltPassword);
      var kek = await deriveKEK(pwField.value, salt, config.iterations);
      await unwrapDEK(config.wrappedDekPassword, config.wrappedDekPasswordIv, kek); // throws if the password is wrong

      await clearAllStorage();
      close();
      vaultKey = null; notes = []; selectedNoteId = null;
      folders = []; activityLog = []; currentFolderId = 'all'; activeTagFilters = [];
      selectMode = false; selectedNoteIds = [];
      recoveryAvailable = false; recoveryModeActive = false; changePasswordOpen = false; biometricAvailable = false;
      stopIdleTimer();
      $('#app-shell').hidden = true;
      $('#lock-screen').classList.remove('hidden');
      renderLockScreen('setup');
      showToast('All data erased from this device', 'success');
    } catch (err) {
      confirmBtn.disabled = false; confirmBtn.textContent = 'Erase Everything';
      errEl.textContent = 'Incorrect password.';
    }
  });
}

/* Export / Import */
async function exportBackup() {
  var config = await getVaultConfig();
  var rawNotes = await getAllNoteRecords();
  var payload = { app: 'NotesVault', version: APP_VERSION, exportedAt: new Date().toISOString(), vault: config, notes: rawNotes };
  var blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var stamp = new Date().toISOString().slice(0, 10);
  a.href = url; a.download = 'notesvault-backup-' + stamp + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  logActivity('backup-exported');
  showToast('Backup exported', 'success');
}
on($('#import-file-input'), 'change', function (e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function () {
    var parsed;
    try { parsed = JSON.parse(reader.result); } catch (err) { showToast('That file is not a valid NotesVault backup', 'danger'); return; }
    if (!parsed || !parsed.vault || !parsed.vault.saltPassword || !Array.isArray(parsed.notes)) {
      showToast('That file is not a valid NotesVault backup', 'danger'); return;
    }
    showConfirm({
      title: 'Replace current vault?',
      message: 'Importing this backup will replace everything currently in your vault. This cannot be undone.',
      confirmLabel: 'Import & Replace', danger: true,
      onConfirm: function () { performImport(parsed); }
    });
  };
  reader.readAsText(file);
  e.target.value = '';
});
async function performImport(parsed) {
  await replaceAllStorage(parsed.vault, parsed.notes);
  vaultKey = null; // must be cleared before lockVault(), or it would try to encrypt a
                    // lock-event with the OLD key and write it into the NEW imported config
  recoveryAvailable = !!parsed.vault.recoveryEnabled;
  biometricAvailable = !!parsed.vault.biometricEnabled;
  showToast('Vault imported', 'success');
  lockVault('import');
  renderLockScreen('imported');
}

/* ============================================================
   GLOBAL EVENT BINDING
   ============================================================ */
function bindGlobalEvents() {
  $all('.nav-item').forEach(function (btn) { on(btn, 'click', function () { switchTab(btn.getAttribute('data-tab')); }); });
  on($('#new-note-btn'), 'click', createNewNote);
  on($('#select-mode-btn'), 'click', toggleSelectMode);
  on($('#fold-btn'), 'click', toggleSidebarFold);
  on($('#menu-btn'), 'click', openMobileSidebar);
  on($('#sidebar-backdrop'), 'click', closeMobileSidebar);
  on($('#settings-btn'), 'click', function () { switchTab('settings'); });
  on($('#theme-toggle-btn'), 'click', cycleTheme);
  on($('#lock-btn'), 'click', function () { lockVault('manual'); });
  on($('#editor-image-input'), 'change', function (e) {
    var file = e.target.files[0];
    if (file && pendingImageTarget) insertImageFile(file, pendingImageTarget.note, pendingImageTarget.bodyEl);
    pendingImageTarget = null;
    e.target.value = '';
  });

  on(document, 'keydown', function (e) {
    if (e.key === 'Escape') {
      if (commandPaletteOpen) { closeCommandPalette(); return; }
      if (openTagPopoverNoteId) { var n = findNote(openTagPopoverNoteId); openTagPopoverNoteId = null; if (n) renderEditorTags(n); }
      if (openFolderPickerNoteId) { var n2 = findNote(openFolderPickerNoteId); openFolderPickerNoteId = null; if (n2) renderEditorTags(n2); }
      closeModalRoot($('#modal-root'));
    }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      if (vaultKey) showCommandPalette();
    }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'n') {
      if (vaultKey && !commandPaletteOpen) { e.preventDefault(); switchTab('notes'); createNewNote(); }
    }
  });

  window.addEventListener('beforeunload', function () { flushPendingSave(true); });
}

init();
})();
