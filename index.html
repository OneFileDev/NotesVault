<style>
/* ============================================================
   NOTESVAULT — DESIGN TOKENS
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
/* Smooths every background/border/text-color change app-wide — most visibly when
   switching Light/Dark/AMOLED or the AMOLED accent, where surfaces would otherwise
   snap instantly while only body's own transition (below) crossfaded. Elements with
   their own transition list (buttons, popovers, etc.) keep their specific one, since
   a more specific selector's transition shorthand takes precedence over this. */
*, *::before, *::after {
  transition: background-color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
body {
  margin: 0;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  transition: background var(--dur-base) var(--ease), color var(--dur-base) var(--ease);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
h1, h2, h3 { margin: 0; font-weight: 550; }
p { margin: 0; }
button { font-family: inherit; }
input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
ul { margin: 0; padding: 0; list-style: none; }
a { color: inherit; }

:root {
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-5: 24px; --space-6: 32px; --space-7: 48px; --space-8: 64px;
  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 16px; --radius-full: 999px;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-strong: cubic-bezier(0.65, 0, 0.35, 1);
  --dur-fast: 140ms; --dur-base: 220ms; --dur-slow: 380ms;
  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'Inter', sans-serif;
  --sidebar-w: 232px;
  --sidebar-w-collapsed: 68px;
}

[data-theme="light"] {
  --bg: #FAFAFA; --surface: #FFFFFF; --surface-2: #F1F1F3;
  --border: rgba(13,13,15,0.10); --border-strong: rgba(13,13,15,0.18);
  --text-primary: #0D0D0F; --text-secondary: rgba(13,13,15,0.62); --text-tertiary: rgba(13,13,15,0.38);
  --accent: #0D0D0F; --accent-hover: #26262A; --accent-text: #FAFAFA; --link: #0D0D0F;
  --danger: #5C2A2A; --danger-hover: #6E3333; --danger-text: #FBF3F3;
  --danger-tint: rgba(92,42,42,0.08);
  --focus-ring: #0D0D0F;
  --shadow-sm: 0 1px 2px rgba(13,13,15,0.06);
  --shadow-md: 0 6px 20px rgba(13,13,15,0.08);
  --shadow-lg: 0 16px 40px rgba(13,13,15,0.14);
  --sheen: linear-gradient(135deg, rgba(255,255,255,0.30), rgba(255,255,255,0) 55%);
  --scrollbar: rgba(13,13,15,0.18);
}
[data-theme="dark"] {
  --bg: #0D0D0F; --surface: #1C1C1F; --surface-2: #232327;
  --border: rgba(212,212,216,0.10); --border-strong: rgba(212,212,216,0.20);
  --text-primary: #D4D4D8; --text-secondary: rgba(212,212,216,0.64); --text-tertiary: rgba(212,212,216,0.40);
  --accent: #0D0D0F; --accent-hover: #000000; --accent-text: #D4D4D8; --link: #D4D4D8;
  --danger: #5C2A2A; --danger-hover: #6E3333; --danger-text: #FBF3F3;
  --danger-tint: rgba(92,42,42,0.18);
  --focus-ring: #D4D4D8;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
  --shadow-md: 0 6px 22px rgba(0,0,0,0.45);
  --shadow-lg: 0 18px 44px rgba(0,0,0,0.55);
  --sheen: linear-gradient(135deg, rgba(255,255,255,0.07), rgba(255,255,255,0) 55%);
  --scrollbar: rgba(212,212,216,0.16);
}
[data-theme="amoled"] {
  --bg: #000000; --surface: #0D0D0F; --surface-2: #131316;
  --border: rgba(212,212,216,0.09); --border-strong: rgba(212,212,216,0.18);
  --text-primary: #D4D4D8; --text-secondary: rgba(212,212,216,0.62); --text-tertiary: rgba(212,212,216,0.38);
  --accent: #BF9B30; --accent-hover: #D4B24A; --accent-text: #14110A; --link: #BF9B30;
  --danger: #5C2A2A; --danger-hover: #6E3333; --danger-text: #FBF3F3;
  --danger-tint: rgba(92,42,42,0.22);
  --focus-ring: #BF9B30;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.6);
  --shadow-md: 0 6px 22px rgba(0,0,0,0.65);
  --shadow-lg: 0 18px 44px rgba(0,0,0,0.75);
  --sheen: linear-gradient(135deg, rgba(255,244,214,0.35), rgba(255,244,214,0) 55%);
  --scrollbar: rgba(212,212,216,0.14);
}
/* AMOLED accent variants — the base rule above is Gold (default). These override
   only the accent-related tokens for the other two selectable options. */
[data-theme="amoled"][data-amoled-accent="platinum"] {
  --accent: #D4D4D8; --accent-hover: #EDEDEF; --accent-text: #0D0D0F; --focus-ring: #D4D4D8; --link: #D4D4D8;
  --sheen: linear-gradient(135deg, rgba(255,255,255,0.35), rgba(255,255,255,0) 55%);
}
[data-theme="amoled"][data-amoled-accent="black"] {
  /* True black, not --surface's #0D0D0F — needs to read as distinct from the
     cards/sidebar it sits on, so it relies on border + sheen for definition
     rather than fill contrast alone. */
  --accent: #000000; --accent-hover: #141414; --accent-text: #D4D4D8; --focus-ring: #D4D4D8; --link: #D4D4D8;
  --border-strong: rgba(212,212,216,0.32);
  --sheen: linear-gradient(135deg, rgba(255,255,255,0.16), rgba(255,255,255,0) 60%);
}

/* Tag colors — muted, desaturated, distinct from accent/danger */
.tag-amber   { --tag-c: #96773F; }
.tag-sage    { --tag-c: #45735B; }
.tag-steel   { --tag-c: #44628A; }
.tag-mauve   { --tag-c: #86445F; }
.tag-violet  { --tag-c: #634488; }
.tag-stone   { --tag-c: #74746B; }

/* Scrollbars */
* { scrollbar-width: thin; scrollbar-color: var(--scrollbar) transparent; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: var(--radius-full); }
::-webkit-scrollbar-track { background: transparent; }

/* Focus */
:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

/* ============================================================
   BUTTONS & FORM ELEMENTS
   ============================================================ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  border: 1px solid transparent; border-radius: var(--radius-md);
  padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
  transition: background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease), opacity var(--dur-fast) var(--ease);
  white-space: nowrap;
}
.btn:active { transform: scale(0.97); }
.btn-block { width: 100%; }
.btn-primary {
  position: relative; overflow: hidden;
  background: var(--accent); color: var(--accent-text); border-color: var(--border-strong);
  box-shadow: var(--shadow-sm);
}
.btn-primary::before { content: ''; position: absolute; inset: 0; background: var(--sheen); pointer-events: none; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-ghost {
  background: transparent; color: var(--text-primary); border-color: var(--border);
}
.btn-ghost:hover { background: var(--surface-2); border-color: var(--border-strong); }
.btn-danger {
  background: var(--danger); color: var(--danger-text); border-color: var(--danger);
}
.btn-danger:hover { background: var(--danger-hover); }
.btn-danger-ghost {
  background: transparent; color: var(--danger); border-color: transparent;
}
.btn-danger-ghost:hover { background: var(--danger-tint); }
.btn-icon {
  display: inline-flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; border-radius: var(--radius-md);
  background: transparent; border: 1px solid transparent; color: var(--text-secondary); cursor: pointer;
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.btn-icon:hover { background: var(--surface-2); color: var(--text-primary); }
.btn-icon svg { width: 18px; height: 18px; }
.btn-icon.active { background: var(--surface-2); color: var(--text-primary); border-color: var(--border); }

.field { display: flex; flex-direction: column; gap: var(--space-2); margin-bottom: var(--space-4); text-align: left; }
.field label { font-size: 13px; font-weight: 600; color: var(--text-secondary); }
input[type="text"], input[type="password"], input[type="email"], textarea, select.select {
  background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: 11px 14px; font-size: 14px; color: var(--text-primary);
  transition: border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
}
input[type="text"]:focus, input[type="password"]:focus, input[type="email"]:focus, select.select:focus {
  border-color: var(--border-strong);
}
input::placeholder { color: var(--text-tertiary); }
.password-field-inner { position: relative; display: flex; }
.password-field-inner input { flex: 1; padding-right: 40px; }
.btn-toggle-visibility {
  position: absolute; right: 4px; top: 4px; bottom: 4px; width: 32px;
  display: flex; align-items: center; justify-content: center;
  background: transparent; border: none; color: var(--text-tertiary); cursor: pointer; border-radius: var(--radius-sm);
}
.btn-toggle-visibility:hover { color: var(--text-secondary); }
.btn-toggle-visibility svg { width: 16px; height: 16px; }
.field-hint { font-size: 12px; color: var(--text-tertiary); }
.field-error { font-size: 12px; color: var(--danger); font-weight: 500; }

/* Toggle switch */
.toggle-switch { position: relative; width: 42px; height: 24px; flex-shrink: 0; }
.toggle-switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 1; }
.toggle-track {
  position: absolute; inset: 0; background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius-full); transition: background var(--dur-base) var(--ease);
}
.toggle-thumb {
  position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%;
  background: var(--text-tertiary); transition: transform var(--dur-base) var(--ease-strong), background var(--dur-base) var(--ease);
}
.toggle-switch input:checked ~ .toggle-track { background: var(--accent); border-color: var(--border-strong); }
.toggle-switch input:checked ~ .toggle-thumb { transform: translateX(18px); background: var(--accent-text); }

/* Segmented control */
.segmented { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 3px; gap: 2px; }
.segmented-btn {
  border: none; background: transparent; color: var(--text-secondary); font-size: 13px; font-weight: 600;
  padding: 7px 14px; border-radius: 7px; cursor: pointer; transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.segmented-btn.active { background: var(--accent); color: var(--accent-text); box-shadow: var(--shadow-sm); }
.segmented-btn:not(.active):hover { color: var(--text-primary); }

/* ============================================================
   LOCK SCREEN
   ============================================================ */
.lock-screen {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  background: var(--bg); z-index: 100; padding: var(--space-5);
  overflow-y: auto;
}
.lock-screen.hidden { display: none; }
.lock-card {
  width: 100%; max-width: 380px; text-align: center; margin: auto 0;
  display: flex; flex-direction: column; align-items: center;
}
.lock-card.unlocking { animation: lockCardOut var(--dur-base) var(--ease) forwards; }
@keyframes lockCardOut { to { opacity: 0; transform: translateY(-14px); } }
.lock-card.shake { animation: shake 380ms var(--ease); }
@keyframes shake {
  10%, 90% { transform: translateX(-2px); } 20%, 80% { transform: translateX(4px); }
  30%, 50%, 70% { transform: translateX(-7px); } 40%, 60% { transform: translateX(7px); }
}
.lock-icon-wrap { display: flex; flex-direction: column; align-items: center; margin-bottom: var(--space-5); }
.lock-icon {
  position: relative; overflow: hidden; width: 60px; height: 60px; border-radius: 50%;
  background: var(--accent); display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow-md);
}
.lock-icon::before { content: ''; position: absolute; inset: 0; background: var(--sheen); }
.lock-icon svg { width: 26px; height: 26px; color: var(--accent-text); position: relative; z-index: 1; }
.bolt-line {
  width: 88px; height: 2px; background: var(--accent); margin-top: 18px;
  transform-origin: left center;
  transition: transform var(--dur-slow) var(--ease-strong), opacity var(--dur-slow) var(--ease-strong);
}
.bolt-line.retract { transform: scaleX(0); opacity: 0; }
.wordmark { font-family: var(--font-display); font-size: 28px; font-weight: 550; letter-spacing: -0.01em; margin-bottom: var(--space-2); }
.lock-tagline { font-size: 14px; color: var(--text-secondary); line-height: 1.5; margin-bottom: var(--space-6); max-width: 320px; }
.lock-form { width: 100%; text-align: left; }
.lock-warning {
  display: flex; gap: var(--space-2); align-items: flex-start; text-align: left;
  font-size: 12.5px; color: var(--text-secondary); line-height: 1.5; background: var(--surface-2);
  border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--space-3); margin-bottom: var(--space-4);
}
.lock-warning svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px; color: var(--danger); }
.btn-spinner {
  display: inline-block; width: 13px; height: 13px; border: 2px solid currentColor; border-top-color: transparent;
  border-radius: 50%; animation: btnSpin 0.7s linear infinite; vertical-align: -2px; margin-right: 6px; opacity: 0.85;
}
@keyframes btnSpin { to { transform: rotate(360deg); } }
.lock-error {
  min-height: 18px; font-size: 13px; color: var(--danger); font-weight: 500; margin-top: var(--space-3);
}
.lock-footer-hint { margin-top: var(--space-6); font-size: 12px; color: var(--text-tertiary); }
.lock-secondary-link {
  display: block; width: 100%; text-align: center; background: none; border: none; color: var(--text-tertiary);
  font-size: 12.5px; font-weight: 600; cursor: pointer; margin-top: var(--space-4);
  text-decoration: underline; text-underline-offset: 2px;
}
.lock-secondary-link:hover { color: var(--text-secondary); }
.recovery-input-field { font-family: 'Courier New', monospace; letter-spacing: 0.03em; text-transform: uppercase; }

/* ============================================================
   APP SHELL
   ============================================================ */
.app-shell { display: flex; height: 100vh; height: 100dvh; opacity: 1; }
.app-shell[hidden] { display: none; }
.app-shell.revealing { animation: fadeIn var(--dur-base) var(--ease); }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.sidebar {
  width: var(--sidebar-w); flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border);

}

.sidebar-nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
.nav-item {
  display: flex; align-items: center; gap: var(--space-3); padding: 10px 12px; border-radius: var(--radius-md);
  background: transparent; border: none; color: var(--text-secondary); font-size: 14px; font-weight: 500;

  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), gap var(--dur-base) var(--ease), padding var(--dur-base) var(--ease);
}
.nav-item:hover { background: var(--surface-2); color: var(--text-primary); }

.nav-label {

}
.sidebar.collapsed .nav-label { opacity: 0; max-width: 0; }
.nav-badge {
  position: absolute; top: -7px; right: -9px; display: inline-flex; align-items: center; justify-content: center;
  min-width: 16px; height: 16px; padding: 0 4px; font-size: 10.5px; font-weight: 700; line-height: 1;
  background: var(--surface-2); color: var(--text-secondary); border: 1.5px solid var(--surface); border-radius: var(--radius-full);
}

.sidebar-footer {

}

}

.fold-btn svg { transition: transform var(--dur-base) var(--ease); }

.sidebar-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 55;
  opacity: 0; pointer-events: none; transition: opacity var(--dur-fast) var(--ease);
}

.main-content { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
.content-header {
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-4);
  padding: 0; border-bottom: none; flex-shrink: 0; min-height: 0; height: 0; overflow: hidden;
}
.header-title { font-family: var(--font-display); font-size: 18px; font-weight: 550; letter-spacing: -0.01em; }
.header-left { display: flex; align-items: center; gap: var(--space-3); }
.menu-btn { display: none; }
.tab-panel { flex: 1; min-height: 0; display: flex; flex-direction: column; animation: fadeIn var(--dur-base) var(--ease); }
.tab-panel[hidden] { display: none; }

/* ============================================================
   NOTES TAB
   ============================================================ */
.notes-panel { flex: 1; display: flex; flex-direction: row; min-height: 0; }
.notes-list-pane { width: 264px; flex-shrink: 0; border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.list-toolbar { display: flex; gap: var(--space-2); padding: var(--space-4); border-bottom: 1px solid var(--border); }

.search-box input { width: 100%; padding-left: 36px; }
.btn-new {
  position: relative; overflow: hidden; flex-shrink: 0; width: 40px; height: 40px; border-radius: var(--radius-md);
  background: var(--accent); border: 1px solid var(--border-strong); color: var(--accent-text);
  display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: var(--shadow-sm);
}

.notes-list { flex: 1; overflow-y: auto; padding: var(--space-2); }
.note-item {
  display: flex; flex-direction: row; align-items: flex-start; gap: var(--space-2); padding: var(--space-3); border-radius: var(--radius-md);

}

.note-item-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }

.mini-folder { display: inline-flex; align-items: center; gap: 2px; font-size: 10.5px; font-weight: 600; color: var(--text-tertiary); }

.folder-bar { position: relative; display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); padding: var(--space-2) var(--space-4); border-bottom: 1px solid var(--border); }
.folder-picker-btn {
  display: inline-flex; align-items: center; gap: 6px; background: transparent; border: none; color: var(--text-secondary);
  font-size: 12.5px; font-weight: 600; cursor: pointer; padding: 4px 6px; border-radius: var(--radius-sm); max-width: 100%; overflow: hidden;
}
.folder-picker-btn:hover { background: var(--surface-2); color: var(--text-primary); }
.folder-picker-btn svg { width: 13px; height: 13px; flex-shrink: 0; }
.folder-picker-btn svg:last-child { width: 12px; height: 12px; opacity: 0.6; }
.folder-picker-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dropdown-popover {
  position: absolute; top: calc(100% + 4px); left: var(--space-4); z-index: 30; min-width: 200px; max-width: 260px;
  background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-md); box-shadow: var(--shadow-lg);
  padding: var(--space-2); max-height: 320px; overflow-y: auto;
  animation: popoverIn var(--dur-fast) var(--ease-strong);
  transform-origin: top left;
}

@keyframes popoverIn { from { opacity: 0; transform: scale(0.96) translateY(-4px); } to { opacity: 1; transform: none; } }
.dropdown-item {
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); width: 100%; text-align: left;
  background: transparent; border: none; color: var(--text-primary); font-size: 13px; font-weight: 500;
  padding: 8px 10px; border-radius: var(--radius-sm); cursor: pointer;
}
.dropdown-item:hover { background: var(--surface-2); }
.dropdown-item.active { background: var(--surface-2); font-weight: 700; }
.dropdown-item svg { width: 14px; height: 14px; flex-shrink: 0; }
.dropdown-item-count { font-size: 11px; color: var(--text-tertiary); font-weight: 600; }
.dropdown-item-block { justify-content: flex-start; }
.dropdown-sep { height: 1px; background: var(--border); margin: var(--space-2) 4px; }

.tag-filter-bar { display: flex; gap: 6px; flex-wrap: wrap; padding: var(--space-2) var(--space-4); border-bottom: 1px solid var(--border); }
.filter-tag-chip {
  font-size: 11.5px; font-weight: 600; padding: 4px 10px; border-radius: var(--radius-full); cursor: pointer;
  background: transparent; border: 1px solid color-mix(in srgb, var(--tag-c) 40%, transparent); color: var(--tag-c);
}
.filter-tag-chip.active { background: var(--tag-c); color: #fff; border-color: var(--tag-c); }

.bulk-action-bar {
  display: flex; align-items: center; justify-content: space-between; padding: var(--space-3) var(--space-4);
  background: var(--surface-2); border-bottom: 1px solid var(--border);
  animation: bulkBarIn var(--dur-base) var(--ease-strong);
}
@keyframes bulkBarIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.bulk-count { font-size: 13px; font-weight: 600; color: var(--text-primary); }
.bulk-actions { display: flex; gap: 4px; }

.editor-pane { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.editor-empty-state, .empty-state {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-3);
  color: var(--text-tertiary); padding: var(--space-6); text-align: center;
}

.editor { flex: 1; display: flex; flex-direction: column; min-height: 0; animation: editorIn var(--dur-fast) var(--ease); }
@keyframes editorIn { from { opacity: 0; } to { opacity: 1; } }
.editor-toolbar {
  display: flex; align-items: center; gap: 2px; padding: var(--space-3) var(--space-5);
  border-bottom: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap;
}
.toolbar-btn {
  width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-sm);
  background: transparent; border: 1px solid transparent; color: var(--text-secondary); cursor: pointer;
}

.editor-history-group { display: inline-flex; align-items: center; gap: 2px; }

.toolbar-sep { width: 1px; height: 22px; background: var(--border); margin: 0 var(--space-2); }
.toolbar-spacer { flex: 1; }

.editor-scroll { flex: 1; overflow-y: auto; padding: var(--space-6) var(--space-6) var(--space-7); }
.editor-title {
  width: 100%; border: none; background: transparent; font-size: 26px; font-weight: 650; font-family: var(--font-display);
  color: var(--text-primary); padding: 0; margin-bottom: var(--space-3); letter-spacing: -0.01em;
}
.editor-title::placeholder { color: var(--text-tertiary); }
.editor-tags-row { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; margin-bottom: var(--space-5); position: relative; }
.tag-chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px 4px 12px; border-radius: var(--radius-full);
  font-size: 12.5px; font-weight: 600; color: var(--tag-c); background: color-mix(in srgb, var(--tag-c) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--tag-c) 30%, transparent);
}
.tag-chip button { background: none; border: none; color: inherit; cursor: pointer; display: flex; opacity: 0.7; padding: 0; }

.btn-add-tag {
  display: inline-flex; align-items: center; gap: 5px; padding: 4px 11px; border-radius: var(--radius-full);
  font-size: 12.5px; font-weight: 600; color: var(--text-tertiary); background: transparent; border: 1px dashed var(--border-strong); cursor: pointer;
}

.tag-popover {
  position: absolute; top: calc(100% + 8px); left: 0; z-index: 20; width: 240px;
  background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-md); box-shadow: var(--shadow-lg);
  padding: var(--space-3);

}

.tag-swatch {
  width: 22px; height: 22px; border-radius: 50%; background: var(--tag-c); border: 2px solid transparent; cursor: pointer; padding: 0;
}
.tag-swatch.selected { border-color: var(--text-primary); }
.tag-popover-row { display: flex; gap: 6px; }
.tag-popover-row input { flex: 1 1 auto; min-width: 0; padding: 8px 10px; font-size: 13px; }
.tag-popover-row button { flex: 0 0 auto; min-width: 54px; padding: 8px 10px !important; }

.editor-body {
  min-height: 240px; font-size: 15px; line-height: 1.75; color: var(--text-primary); outline: none;
}
.editor-body:empty::before { content: attr(data-placeholder); color: var(--text-tertiary); pointer-events: none; }
.editor-body ul, .editor-body ol { padding-left: 1.4em; margin: 0.6em 0; }
.editor-body b, .editor-body strong { font-weight: 700; }
.editor-body h2 { font-size: 20px; font-weight: 700; margin: 0.9em 0 0.35em; letter-spacing: -0.01em; line-height: 1.3; }
.editor-body h3 { font-size: 17px; font-weight: 700; margin: 0.8em 0 0.3em; letter-spacing: -0.01em; line-height: 1.3; }
.wiki-link { -webkit-tap-highlight-color: transparent; color: var(--link); font-weight: 650; text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--link) 55%, transparent); text-underline-offset: 2px; cursor: pointer; border-radius: 4px; padding: 0 2px; }
.wiki-link:hover { background: var(--surface-2); text-decoration-color: var(--link); }
.wiki-link-missing { color: var(--danger); text-decoration-style: dashed; }
/* Legacy pad styling retained only for migrated vaults; new caret markers are zero-width text nodes, not nested editors. */
.wiki-link-pad { display: none; }
.linked-notes-panel { margin-top: var(--space-7); padding-top: var(--space-5); border-top: 1px solid var(--border); } .linked-notes-panel.is-hidden { display: none; }
.linked-notes-heading { display: flex; align-items: center; gap: var(--space-2); font-size: 13px; font-weight: 700; color: var(--text-secondary); margin-bottom: var(--space-3); }
.linked-notes-heading svg { width: 15px; height: 15px; }
.linked-notes-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4); }
.linked-notes-group { min-width: 0; }
.linked-notes-group-title { font-size: 12px; font-weight: 700; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: var(--space-2); }
.linked-note-list { display: flex; flex-direction: column; gap: 4px; }
.linked-note-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
.linked-unlink-btn { flex: 0 0 32px; width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--border); border-radius: var(--radius-md); background: transparent; color: var(--text-tertiary); cursor: pointer; touch-action: manipulation; }
.linked-unlink-btn:hover { color: var(--text-primary); background: var(--surface-2); border-color: var(--border-strong); }
.linked-unlink-btn svg { width: 15px; height: 15px; }
.linked-note-btn, .linked-missing-btn { width: 100%; display: flex; align-items: center; gap: var(--space-2); padding: 8px 10px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-primary); border-radius: var(--radius-md); cursor: pointer; text-align: left; font-size: 13px; }
.linked-note-btn:hover, .linked-missing-btn:hover { border-color: var(--border-strong); background: var(--surface); }
.linked-note-btn svg, .linked-missing-btn svg { width: 15px; height: 15px; flex-shrink: 0; color: var(--text-tertiary); }
.linked-missing-btn { border-style: dashed; color: var(--text-secondary); }
.linked-missing-btn svg { color: var(--accent); }
.linked-notes-empty { font-size: 12.5px; color: var(--text-tertiary); line-height: 1.5; padding: 8px 0; }
.wiki-autocomplete {
  position: fixed; z-index: 80; width: min(320px, calc(100vw - 24px)); max-height: 280px; overflow: auto;
  background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg); padding: 6px; animation: popoverIn var(--dur-fast) var(--ease-strong);
}
.wiki-autocomplete[hidden] { display: none; }
.wiki-autocomplete-heading { padding: 7px 9px 6px; font-size: 11px; font-weight: 700; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: .06em; }
.wiki-autocomplete-list { display: flex; flex-direction: column; gap: 2px; }
.wiki-autocomplete-item {
  width: 100%; display: flex; align-items: center; gap: 9px; min-height: 42px; padding: 9px 10px; border: 0; background: transparent;
  border-radius: var(--radius-sm); color: var(--text-primary); cursor: pointer; text-align: left; font-size: 13px; touch-action: manipulation;
}
@media (max-width: 700px) {
  .wiki-autocomplete { width: min(360px, calc(100vw - 16px)); max-height: min(300px, 42vh); padding: 5px; }
  .wiki-autocomplete-item { min-height: 44px; padding: 10px 11px; font-size: 14px; }
  .wiki-autocomplete-heading { padding: 8px 10px 7px; font-size: 11px; }
}
.wiki-autocomplete-item:hover, .wiki-autocomplete-item.active { background: var(--surface-2); }
.wiki-autocomplete-item svg { width: 15px; height: 15px; flex-shrink: 0; color: var(--text-tertiary); }
.wiki-autocomplete-item-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.wiki-autocomplete-item-hint { margin-left: auto; flex-shrink: 0; font-size: 10px; color: var(--text-tertiary); }
.wiki-autocomplete-empty { padding: 10px; color: var(--text-tertiary); font-size: 12.5px; }
@media (max-width: 700px) { .linked-notes-grid { grid-template-columns: 1fr; } }
.checklist-item { display: flex; align-items: flex-start; gap: 8px; margin: 4px 0; }
.checklist-checkbox { margin-top: 5px; width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
.checklist-item.checked { color: var(--text-tertiary); text-decoration: line-through; }
.code-block {
  background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4); margin: 0.6em 0; overflow-x: auto;
}
.code-block code { font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.5; white-space: pre; }
.note-image { max-width: 100%; border-radius: var(--radius-md); border: 1px solid var(--border); margin: 0.6em 0; display: block; box-shadow: var(--shadow-sm); }
.note-image.is-selected { outline: 2px solid var(--focus-ring); outline-offset: 3px; }
.image-resize-popover { position: fixed; z-index: 80; display: flex; align-items: center; gap: 6px; padding: 7px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-md); box-shadow: var(--shadow-lg); }
.image-resize-popover[hidden] { display: none; }
.image-resize-label { font-size: 11px; font-weight: 700; color: var(--text-tertiary); padding: 0 4px; }
.image-resize-btn { min-width: 34px; height: 30px; padding: 0 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-2); color: var(--text-secondary); font-size: 12px; font-weight: 700; cursor: pointer; }
.image-resize-btn:hover { background: var(--surface); color: var(--text-primary); border-color: var(--border-strong); }
.image-resize-btn.active { background: var(--accent); color: var(--accent-text); border-color: var(--border-strong); }
.image-resize-btn.reset { min-width: 48px; }
@media (max-width: 700px) { .image-resize-popover { max-width: calc(100vw - 24px); overflow-x: auto; } }
.editor-meta { padding: var(--space-3) var(--space-6); border-top: 1px solid var(--border); font-size: 12px; color: var(--text-tertiary); flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap; }

/* Syntax highlighting — muted, theme-adaptive token colors rather than an off-the-shelf
   loud theme, to stay consistent with the app's restrained palette. */
[data-theme="light"] {
  --code-keyword: #7A3B8A; --code-string: #2F6B4F; --code-number: #8A5A1F; --code-attr: #2F5B8A;
}
[data-theme="dark"], [data-theme="amoled"] {
  --code-keyword: #C299D9; --code-string: #8FCDA8; --code-number: #D9B97A; --code-attr: #8FB8D9;
}
.hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-section { color: var(--code-keyword); }
.hljs-string, .hljs-attr, .hljs-symbol, .hljs-bullet, .hljs-addition { color: var(--code-string); }
.hljs-number, .hljs-meta { color: var(--code-number); }
.hljs-comment, .hljs-quote, .hljs-deletion { color: var(--text-tertiary); font-style: italic; }
.hljs-title, .hljs-name, .hljs-built_in, .hljs-tag { color: var(--code-attr); }
.hljs-function, .hljs-title.function_ { color: var(--text-primary); font-weight: 700; }

/* Version history modal */
.version-list { max-height: 320px; overflow-y: auto; margin-bottom: var(--space-4); }
.version-row {
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
  padding: var(--space-3) 0; border-top: 1px solid var(--border);
}
.version-row:first-child { border-top: none; }
.version-row-main { min-width: 0; flex: 1; }
.version-row-time { font-size: 12.5px; font-weight: 600; color: var(--text-primary); }
.version-row-preview { font-size: 12px; color: var(--text-tertiary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }

/* ============================================================
   TRASH TAB
   ============================================================ */
.panel-header { padding: var(--space-5) var(--space-6); border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-4); flex-shrink: 0; }
.panel-title { font-family: var(--font-display); font-size: 20px; font-weight: 550; margin-bottom: 4px; }
.panel-subtitle { font-size: 13px; color: var(--text-secondary); max-width: 420px; line-height: 1.5; }
.trash-body { flex: 1; overflow-y: auto; padding: var(--space-3) var(--space-4); }
.trash-item {
  display: flex; align-items: center; gap: var(--space-4); padding: var(--space-3) var(--space-4); border-radius: var(--radius-md);
  border: 1px solid var(--border); margin-bottom: var(--space-2); background: var(--surface);
}
.trash-item-main { flex: 1; min-width: 0; }
.trash-item-title { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trash-item-meta { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }
.trash-item-actions { display: flex; gap: var(--space-2); flex-shrink: 0; }

/* ============================================================
   SETTINGS TAB
   ============================================================ */
.settings-scroll { flex: 1; overflow-y: auto; }
.settings-content { max-width: clamp(620px, 58vw, 880px); margin: 0 auto; padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-6); }
.settings-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-5); }
.settings-section h2 { font-family: var(--font-display); font-size: 17px; font-weight: 550; margin-bottom: var(--space-4); }
.setting-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); padding: var(--space-3) 0; border-top: 1px solid var(--border); }
.setting-row:first-of-type { border-top: none; padding-top: 0; }
.setting-row-text { flex: 1; min-width: 0; }
.setting-row-label { font-size: 14px; font-weight: 500; }
.setting-row-desc { font-size: 12.5px; color: var(--text-tertiary); margin-top: 2px; }
.setting-row-actions { display: flex; gap: var(--space-3); flex-wrap: wrap; }
.settings-section-danger { border-color: rgba(92,42,42,0.35); }
.settings-section-danger h2 { color: var(--danger); }
.security-block-divided { border-top: 1px solid var(--border); margin-top: var(--space-4); padding-top: var(--space-4); }
.form-actions-row { display: flex; justify-content: flex-end; gap: var(--space-3); margin-top: var(--space-2); }
.recovery-key-box {
  font-family: 'Courier New', monospace; font-size: 15px; font-weight: 700; letter-spacing: 0.03em;
  text-align: center; padding: var(--space-4); background: var(--surface-2); border: 1px solid var(--border-strong);
  border-radius: var(--radius-md); margin-bottom: var(--space-4); user-select: all; word-break: break-all; color: var(--text-primary);
}
.rk-confirm-row { display: flex; align-items: center; gap: var(--space-2); font-size: 13px; color: var(--text-secondary); margin-bottom: var(--space-4); cursor: pointer; }
.rk-confirm-row input { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
.about-tagline { font-size: 14px; color: var(--text-secondary); line-height: 1.6; margin-bottom: var(--space-3); }
.version-badge {
  display: inline-flex; align-items: center; font-size: 11.5px; font-weight: 700; letter-spacing: 0.02em;
  background: var(--surface-2); border: 1px solid var(--border); color: var(--text-secondary);
  padding: 3px 9px; border-radius: var(--radius-full); margin-bottom: var(--space-5);
}
.changelog h3 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-tertiary); margin-bottom: var(--space-3); }
.changelog-item { display: flex; gap: var(--space-3); padding: var(--space-2) 0; font-size: 13px; }
.changelog-version { font-weight: 700; color: var(--text-primary); flex-shrink: 0; width: 56px; }
.changelog-date { color: var(--text-tertiary); flex-shrink: 0; width: 64px; }
.changelog-note { color: var(--text-secondary); }
.built-by { font-size: 12.5px; color: var(--text-tertiary); margin-top: var(--space-5); padding-top: var(--space-4); border-top: 1px solid var(--border); }
.built-by a { color: var(--text-secondary); font-weight: 600; text-decoration: none; border-bottom: 1px solid var(--border-strong); }
.built-by a:hover { color: var(--text-primary); }

/* ============================================================
   MODAL & TOAST
   ============================================================ */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center;
  z-index: 200; padding: var(--space-4); animation: fadeIn var(--dur-fast) var(--ease);
}
.modal {
  width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg); padding: var(--space-5); box-shadow: var(--shadow-lg);
  animation: modalIn var(--dur-base) var(--ease-strong);
}
@keyframes modalIn { from { opacity: 0; transform: translateY(8px) scale(0.98); } to { opacity: 1; transform: none; } }
.modal-backdrop.modal-closing, .palette-backdrop.modal-closing { animation: fadeOut var(--dur-fast) var(--ease) forwards; }
.modal-backdrop.modal-closing .modal, .palette-backdrop.modal-closing .palette { animation: modalOut var(--dur-fast) var(--ease) forwards; }
@keyframes fadeOut { to { opacity: 0; } }
@keyframes modalOut { to { opacity: 0; transform: translateY(6px) scale(0.98); } }
.modal-title { font-family: var(--font-display); font-size: 18px; font-weight: 550; margin-bottom: var(--space-2); }
.modal-message { font-size: 13.5px; color: var(--text-secondary); line-height: 1.55; margin-bottom: var(--space-5); }
.modal-actions { display: flex; justify-content: flex-end; gap: var(--space-3); }
.manage-folders-list { display: flex; flex-direction: column; gap: 2px; margin-bottom: var(--space-4); max-height: 280px; overflow-y: auto; }
.manage-folder-row { display: flex; align-items: center; gap: var(--space-2); padding: 8px 4px; border-top: 1px solid var(--border); }
.manage-folder-row:first-child { border-top: none; }
.manage-folder-name { flex: 1; font-size: 13.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.manage-folder-count { font-size: 11.5px; color: var(--text-tertiary); font-weight: 600; }

.palette-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 250; display: flex;
  align-items: flex-start; justify-content: center; padding-top: 12vh; padding-left: var(--space-4); padding-right: var(--space-4);
  animation: fadeIn var(--dur-fast) var(--ease);
}
.palette {
  width: 100%; max-width: 520px; background: var(--surface); border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); overflow: hidden;
  animation: modalIn var(--dur-base) var(--ease-strong);
}
.palette-input-row { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-4); border-bottom: 1px solid var(--border); }
.palette-input-row svg { width: 17px; height: 17px; color: var(--text-tertiary); flex-shrink: 0; }
.palette-input-row input { flex: 1; border: none; background: transparent; font-size: 15px; color: var(--text-primary); padding: 0; }
.palette-input-row input::placeholder { color: var(--text-tertiary); }
.palette-results { max-height: 360px; overflow-y: auto; padding: var(--space-2); }
.palette-item {
  display: flex; align-items: center; gap: var(--space-3); width: 100%; text-align: left; background: transparent; border: none;
  color: var(--text-primary); font-size: 13.5px; font-weight: 500; padding: 10px 12px; border-radius: var(--radius-md); cursor: pointer;
}
.palette-item svg { width: 15px; height: 15px; color: var(--text-tertiary); flex-shrink: 0; }
.palette-item span:not(.palette-item-hint) { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.palette-item.active { background: var(--surface-2); }
.palette-item-hint { font-size: 10.5px; font-weight: 700; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.04em; }
.palette-empty { padding: var(--space-5); text-align: center; color: var(--text-tertiary); font-size: 13px; }

.activity-list { display: flex; flex-direction: column; gap: 2px; }
.activity-row { display: flex; align-items: center; gap: var(--space-3); padding: 8px 0; border-top: 1px solid var(--border); font-size: 13px; }
.activity-row:first-child { border-top: none; }
.activity-row svg { width: 14px; height: 14px; color: var(--text-tertiary); flex-shrink: 0; }
.activity-label { flex: 1; color: var(--text-primary); }
.activity-time { font-size: 11.5px; color: var(--text-tertiary); flex-shrink: 0; }

.toast-container { position: fixed; bottom: var(--space-5); right: var(--space-5); z-index: 300; display: flex; flex-direction: column; gap: var(--space-2); }
.toast {
  background: var(--surface); border: 1px solid var(--border-strong); color: var(--text-primary);
  padding: 12px 18px; border-radius: var(--radius-md); font-size: 13.5px; font-weight: 500; box-shadow: var(--shadow-lg);
  display: flex; align-items: center; gap: var(--space-2); animation: toastIn var(--dur-base) var(--ease-strong);
}
.toast svg { width: 16px; height: 16px; flex-shrink: 0; }
.toast.success svg { color: #4A8A6A; }
.toast.danger svg { color: var(--danger); }
@keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.toast.leaving { animation: toastOut var(--dur-fast) var(--ease) forwards; }
@keyframes toastOut { to { opacity: 0; transform: translateY(6px); } }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 860px) {
  .menu-btn { display: flex; }
  .sidebar {
    position: fixed; top: 0; bottom: 0; left: 0; z-index: 60; width: 250px;
    transform: translateX(-100%); transition: transform var(--dur-base) var(--ease); box-shadow: var(--shadow-lg);
  }
  .sidebar.mobile-open { transform: translateX(0); }
  .sidebar.collapsed { width: 250px; }
  .sidebar.collapsed .sidebar-header { gap: var(--space-2); }
  .sidebar.collapsed .wordmark-group { opacity: 1; max-width: 200px; pointer-events: auto; }
  .sidebar.collapsed .nav-label { opacity: 1; max-width: 120px; }
  .sidebar.collapsed .nav-item { gap: var(--space-3); padding: 10px 12px; }
  .sidebar.collapsed .sidebar-footer { height: 36px; }
  .sidebar.collapsed .footer-icon-btn:nth-child(1) { transform: translate(-62px, 0); }
  .sidebar.collapsed .footer-icon-btn:nth-child(2) { transform: translate(-18px, 0); }
  .sidebar.collapsed .footer-icon-btn:nth-child(3) { transform: translate(26px, 0); }
  .fold-btn { display: none; }
  .sidebar-backdrop.show { opacity: 1; pointer-events: auto; }
  .notes-panel { position: relative; overflow: hidden; }
  .notes-list-pane { position: absolute; inset: 0; width: 100%; transition: transform var(--dur-base) var(--ease); z-index: 2; background: var(--bg); }
  .editor-pane { position: absolute; inset: 0; width: 100%; transform: translateX(100%); transition: transform var(--dur-base) var(--ease); background: var(--bg); }
  .notes-panel.mobile-show-editor .notes-list-pane { transform: translateX(-100%); }
  .notes-panel.mobile-show-editor .editor-pane { transform: translateX(0); }
  .editor-back-btn { display: flex !important; }
  .content-header { height: auto; overflow: visible; padding: 6px var(--space-4); min-height: 40px; border-bottom: 1px solid var(--border); }
  .content-header .header-left { display: flex; }
  .content-header .header-actions { display: flex; }
  .settings-content { padding: var(--space-4) var(--space-4) var(--space-8); }
  .trash-body { padding-bottom: var(--space-7); }
  .editor-scroll { padding-bottom: var(--space-7); }
  .notes-list { padding-bottom: var(--space-4); }
  .trash-item { flex-direction: column; align-items: stretch; gap: var(--space-3); }
  .trash-item-actions { justify-content: flex-start; }
  .panel-header { flex-direction: column; align-items: stretch; }
  .panel-header .btn { align-self: flex-start; }
  .changelog-item { flex-direction: column; gap: 2px; }
  .changelog-version, .changelog-date { width: auto; }
  .setting-row { flex-wrap: wrap; }
}
.editor-back-btn { display: none; }

@media (max-height: 820px) {
  .lock-icon-wrap { margin-bottom: var(--space-4); }
  .lock-icon { width: 48px; height: 48px; }
  .lock-icon svg { width: 20px; height: 20px; }
  .bolt-line { margin-top: 14px; }
  .wordmark { font-size: 22px; margin-bottom: 4px; }
  .lock-tagline { margin-bottom: var(--space-4); }
  .lock-footer-hint { margin-top: var(--space-4); }
}

    publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials: [{ id: b64ToBuf(credentialIdB64), type: 'public-key' }],
      userVerification: 'required',
      extensions: { prf: { eval: { first: WEBAUTHN_PRF_SALT } } },
      timeout: 60000
    }
  });
  if (!assertion) throw new Error('no-assertion');
  var ext = assertion.getClientExtensionResults();
  if (!ext.prf || !ext.prf.results || !ext.prf.results.first) throw new Error('prf-unavailable');
  return new Uint8Array(ext.prf.results.first);
}

/* ============================================================
   STORAGE — abstracts over two backends:
   1) Anthropic's artifact `window.storage`, when present. This is
      the persistent key-value store designed to survive artifact
      reloads inside Claude.ai — raw IndexedDB does NOT reliably
      survive across artifact version updates there, which is why
      notes were disappearing between versions.
   2) Real IndexedDB, used when this file is opened standalone
      (double-clicked, hosted, etc.) outside Claude.ai, where
      window.storage does not exist. Same offline-capable,
      no-server behavior either way.
   ============================================================ */
var hasArtifactStorage = !!(window.storage && typeof window.storage.get === 'function');
var db = null;                  // IndexedDB handle (standalone backend only)
var rawNotesCache = null;       // { [id]: {id, iv, cipher} } (window.storage backend only)

function openIDB() {
  return new Promise(function (resolve, reject) {
    var req = indexedDB.open('notesvault-db', 1);
    req.onupgradeneeded = function (e) {
      var d = e.target.result;
      if (!d.objectStoreNames.contains('vault')) d.createObjectStore('vault', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('notes')) d.createObjectStore('notes', { keyPath: 'id' });
    };
    req.onsuccess = function () { resolve(req.result); };
    req.onerror = function () { reject(req.error); };
  });
}
function idbGet(store, key) {
  return new Promise(function (resolve, reject) {
    var tx = db.transaction(store, 'readonly').objectStore(store).get(key);
    tx.onsuccess = function () { resolve(tx.result || null); };
    tx.onerror = function () { reject(tx.error); };
  });
}
function idbGetAll(store) {
  return new Promise(function (resolve, reject) {
    var tx = db.transaction(store, 'readonly').objectStore(store).getAll();
    tx.onsuccess = function () { resolve(tx.result || []); };
    tx.onerror = function () { reject(tx.error); };
  });
}
function idbPut(store, value) {
  return new Promise(function (resolve, reject) {
    var tx = db.transaction(store, 'readwrite').objectStore(store).put(value);
    tx.onsuccess = function () { resolve(); };
    tx.onerror = function () { reject(tx.error); };
  });
}
function idbDelete(store, key) {
  return new Promise(function (resolve, reject) {
    var tx = db.transaction(store, 'readwrite').objectStore(store).delete(key);
    tx.onsuccess = function () { resolve(); };
    tx.onerror = function () { reject(tx.error); };
  });
}
function idbClearStore(store) {
  return new Promise(function (resolve, reject) {
    var tx = db.transaction(store, 'readwrite').objectStore(store).clear();
    tx.onsuccess = function () { resolve(); };
    tx.onerror = function () { reject(tx.error); };
  });
}

async function storageInit() {
  if (hasArtifactStorage) {
    try {
      // Feature detection alone isn't proof it actually works here — verify with a real round-trip.
      await window.storage.set('__nv_probe__', '1', false);
      try { await window.storage.delete('__nv_probe__', false); } catch (e2) { /* cleanup best-effort only */ }
      return true;
    } catch (e) {
      hasArtifactStorage = false; // fall through to the IndexedDB backend below
    }
  }
  try { db = await openIDB(); return true; } catch (e) { return false; }
}
async function getVaultConfig() {
  if (hasArtifactStorage) {
    try {
      var r = await window.storage.get('vault-config', false);
      return r ? JSON.parse(r.value) : null;
    } catch (e) { return null; }
  }
  return idbGet('vault', 'config');
}
async function setVaultConfig(config) {
  if (hasArtifactStorage) { await window.storage.set('vault-config', JSON.stringify(config), false); return; }
  await idbPut('vault', config);
}
async function getAllNoteRecords() {
  if (hasArtifactStorage) {
    try {
      var r = await window.storage.get('notes-collection', false);
      rawNotesCache = r ? JSON.parse(r.value) : {};
    } catch (e) { rawNotesCache = {}; }
    return Object.keys(rawNotesCache).map(function (k) { return rawNotesCache[k]; });
  }
  return idbGetAll('notes');
}
async function saveNoteRecord(record) {
  if (hasArtifactStorage) {
    if (!rawNotesCache) rawNotesCache = {};
    rawNotesCache[record.id] = record;
    await window.storage.set('notes-collection', JSON.stringify(rawNotesCache), false);
    return;
  }
  await idbPut('notes', record);
}
async function deleteNoteRecord(id) {
  if (hasArtifactStorage) {
    if (!rawNotesCache) rawNotesCache = {};
    delete rawNotesCache[id];
    await window.storage.set('notes-collection', JSON.stringify(rawNotesCache), false);
    return;
  }
  await idbDelete('notes', id);
}
async function clearAllStorage() {
  if (hasArtifactStorage) {
    rawNotesCache = {};
    try { await window.storage.delete('vault-config', false); } catch (e) { /* already absent */ }
    try { await window.storage.delete('notes-collection', false); } catch (e) { /* already absent */ }
    return;
  }
  await idbClearStore('vault');
  await idbClearStore('notes');
}
async function replaceAllStorage(vaultConfig, noteRecords) {
  await clearAllStorage();
  await setVaultConfig(vaultConfig);
  if (hasArtifactStorage) {
    rawNotesCache = {};
    noteRecords.forEach(function (r) { rawNotesCache[r.id] = r; });
    await window.storage.set('notes-collection', JSON.stringify(rawNotesCache), false);
  } else {
    for (var i = 0; i < noteRecords.length; i++) await idbPut('notes', noteRecords[i]);
  }
}

/* ============================================================
   VAULT META — folders and the activity log are encrypted together
   under the same DEK as notes, so they never leak in plaintext.
   Only successful, unlocked-session events are logged — a failed
   unlock attempt has no key to encrypt a record with, and logging
   it in the clear would itself be a metadata leak, so it's simply
   not recorded. This is a deliberate zero-knowledge tradeoff.
   ============================================================ */
async function persistVaultMeta(keyOverride) {
  var key = keyOverride || vaultKey;
  if (!key) return;
  try {
    var config = await getVaultConfig();
    if (!config) return;
    var enc = await encryptObj(key, { folders: folders, activityLog: activityLog });
    config.metaIv = enc.iv; config.metaCipher = enc.cipher;
    await setVaultConfig(config);
  } catch (e) { /* best-effort */ }
}
function logActivity(event, detail, keyOverride) {
  activityLog.unshift({ ts: Date.now(), event: event, detail: detail || null });
  if (activityLog.length > ACTIVITY_LOG_LIMIT) activityLog.length = ACTIVITY_LOG_LIMIT;
  persistVaultMeta(keyOverride);
}
async function loadVaultMeta(dek, config) {
  if (config.metaCipher) {
    try {
      var meta = await decryptObj(dek, config.metaIv, config.metaCipher);
      folders = meta.folders || [];
      activityLog = meta.activityLog || [];
      return;
    } catch (e) { /* fall through to defaults below */ }
  }
  folders = [];
  activityLog = [];
}

function showCommandPalette() {
  commandPaletteOpen = true;

  root.innerHTML =
    '<div class="palette-backdrop" id="palette-backdrop">' +
      '<div class="palette" role="dialog" aria-modal="true">' +

function closeCommandPalette() {

  if ($('#palette-backdrop')) closeModalRoot($('#modal-root'));
}
function paletteMatches(query) {
  var q = query.trim().toLowerCase();
  var noteResults = !q ? [] : notes.filter(function (n) { return !n.deleted && (n.title || '').toLowerCase().indexOf(q) !== -1; })
    .slice(0, 8)
    .map(function (n) { return { type: 'note', id: n.id, label: n.title && n.title.trim() ? n.title : 'Untitled note', icon: 'file-text' }; });
  var cmdResults = COMMANDS.filter(function (c) { return !q || c.label.toLowerCase().indexOf(q) !== -1; })
    .map(function (c) { return { type: 'command', label: c.label, icon: c.icon, action: c.action }; });
  return noteResults.concat(cmdResults);
}
function renderPaletteResults(query) {
  var results = paletteMatches(query);
  var container = $('#palette-results');
  if (!results.length) { container.innerHTML = '<div class="palette-empty">No matches.</div>'; return; }
  if (paletteSelectedIndex >= results.length) paletteSelectedIndex = results.length - 1;
  container.innerHTML = results.map(function (r, i) {
    return '<button class="palette-item' + (i === paletteSelectedIndex ? ' active' : '') + '" data-index="' + i + '">' +
      '<i data-lucide="' + r.icon + '"></i><span>' + escapeHtml(r.label) + '</span>' +
      (r.type === 'note' ? '<span class="palette-item-hint">Note</span>' : '') +
    '</button>';
  }).join('');
  icons();
  $all('.palette-item', container).forEach(function (btn) {
    on(btn, 'click', function () { executePaletteResult(results[parseInt(btn.getAttribute('data-index'), 10)]); });
  });
}
function handlePaletteKeydown(e) {
  var results = paletteMatches($('#palette-input').value);
  if (e.key === 'ArrowDown') {
    e.preventDefault(); paletteSelectedIndex = Math.min(paletteSelectedIndex + 1, results.length - 1);
    renderPaletteResults($('#palette-input').value); scrollPaletteIntoView();
  } else if (e.key === 'ArrowUp') {
    e.preventDefault(); paletteSelectedIndex = Math.max(paletteSelectedIndex - 1, 0);
    renderPaletteResults($('#palette-input').value); scrollPaletteIntoView();
  } else if (e.key === 'Enter') {
    e.preventDefault(); if (results[paletteSelectedIndex]) executePaletteResult(results[paletteSelectedIndex]);
  } else if (e.key === 'Escape') {
    e.preventDefault(); closeCommandPalette();
  }
}
function scrollPaletteIntoView() {
  var active = $('.palette-item.active');
  if (active) active.scrollIntoView({ block: 'nearest' });
}
function executePaletteResult(result) {
  closeCommandPalette();
  if (result.type === 'note') { switchTab('notes'); selectNote(result.id); }
  else result.action();
}

/* Shared by all three unlock paths below: decrypts every stored note record
   with the just-unwrapped DEK, skipping any record that fails to decrypt
   (e.g. corrupted), and runs each body through the sanitizer as a defense-in-
   depth pass — covering notes saved before the sanitizer existed, and any
   that arrived via an imported backup. */
async function decryptAllNoteRecords(dek) {
  var rawNotes = await getAllNoteRecords();
  var decrypted = [];
  for (var i = 0; i < rawNotes.length; i++) {
    try {
      var plain = await decryptObj(dek, rawNotes[i].iv, rawNotes[i].cipher);
      plain.id = rawNotes[i].id;
      if (typeof plain.body === 'string') plain.body = sanitizeNoteHtml(plain.body);
      decrypted.push(plain);
    } catch (e2) { /* skip unreadable record */ }
  }
  return decrypted;
}

async function handleSetupSubmit() {
  var pw = $('#pw-new').value, confirm = $('#pw-confirm').value;
  var errEl = $('#lock-error');
  if (pw.length < 8) { errEl.textContent = 'Use at least 8 characters.'; return; }
  if (pw !== confirm) { errEl.textContent = "Passwords don't match."; lockCardShake(); return; }
  errEl.textContent = '';
  var submitBtn = $('#unlock-form button[type="submit"]');
  setBtnLoading(submitBtn, 'Creating vault…');

  try {
    var saltPassword = crypto.getRandomValues(new Uint8Array(16));
    var kek = await deriveKEK(pw, saltPassword, PBKDF2_ITERATIONS);
    var dek = await generateDEK();
    var wrapped = await wrapDEK(dek, kek);
    await setVaultConfig({
      id: 'config',
      saltPassword: bufToB64(saltPassword), iterations: PBKDF2_ITERATIONS,
      wrappedDekPasswordIv: wrapped.iv, wrappedDekPassword: wrapped.wrapped,
      recoveryEnabled: false, saltRecovery: null, wrappedDekRecoveryIv: null, wrappedDekRecovery: null,
      biometricEnabled: false, biometricCredentialId: null, wrappedDekBiometricIv: null, wrappedDekBiometric: null,
      metaIv: null, metaCipher: null,
      createdAt: Date.now()
    });
    vaultKey = dek;
    notes = [];
    folders = [];
    activityLog = [];
    recoveryAvailable = false;
    biometricAvailable = false;
    logActivity('vault-created');
    completeUnlock();
  } catch (err) {
    submitBtn.disabled = false; submitBtn.textContent = 'Create Vault';
    errEl.textContent = 'Could not create the vault (' + (err && err.message ? err.message : 'unknown error') + '). Please try again.';
  }
}

async function handleUnlockSubmit() {
  var pw = $('#pw-unlock').value;
  var errEl = $('#lock-error');
  var submitBtn = $('#unlock-form button[type="submit"]');
  setBtnLoading(submitBtn, 'Unlocking…');
  try {
    var config = await getVaultConfig();
    if (!config) throw new Error('no-vault');
    var saltPassword = b64ToBuf(config.saltPassword);
    var kek = await deriveKEK(pw, saltPassword, config.iterations);
    var dek = await unwrapDEK(config.wrappedDekPassword, config.wrappedDekPasswordIv, kek);

    notes = await decryptAllNoteRecords(dek);
    vaultKey = dek;
    recoveryAvailable = !!config.recoveryEnabled;
    biometricAvailable = !!config.biometricEnabled;
    await loadVaultMeta(dek, config);
    purgeExpiredTrash();
    errEl.textContent = '';
    logActivity('unlock', { method: 'password' });
    completeUnlock();
  } catch (err) {
    submitBtn.disabled = false; submitBtn.textContent = 'Unlock';
    errEl.textContent = 'Incorrect password. Try again.';
    lockCardShake();
    var f = $('#pw-unlock'); if (f) { f.value = ''; f.focus(); }
  }
}

async function handleRecoveryUnlockSubmit() {
  var normalized = normalizeRecoveryInput($('#recovery-input').value);
  var errEl = $('#lock-error');
  var submitBtn = $('#unlock-form button[type="submit"]');
  setBtnLoading(submitBtn, 'Unlocking…');
  try {
    var config = await getVaultConfig();
    if (!config || !config.recoveryEnabled) throw new Error('no-recovery');
    var saltRecovery = b64ToBuf(config.saltRecovery);
    var kek = await deriveKEK(normalized, saltRecovery, config.iterationsRecovery || config.iterations);
    var dek = await unwrapDEK(config.wrappedDekRecovery, config.wrappedDekRecoveryIv, kek);

    notes = await decryptAllNoteRecords(dek);
    vaultKey = dek;
    recoveryAvailable = true;
    biometricAvailable = !!config.biometricEnabled;
    await loadVaultMeta(dek, config);
    purgeExpiredTrash();
    errEl.textContent = '';
    recoveryModeActive = true;
    logActivity('unlock', { method: 'recovery' });
    completeUnlock();
  } catch (err) {
    submitBtn.disabled = false; submitBtn.textContent = 'Unlock with Recovery Key';
    errEl.textContent = 'That recovery key is not valid.';
    lockCardShake();
  }
}

async function handleBiometricUnlockSubmit(silent) {
  var btn = $('#biometric-unlock-btn');
  var errEl = $('#lock-error');
  if (!silent) errEl.textContent = '';
  setBtnLoading(btn, 'Waiting for biometric…');
  try {
    var config = await getVaultConfig();
    if (!config || !config.biometricEnabled) throw new Error('no-biometric');
    var secretBytes = await getBiometricSecret(config.biometricCredentialId);
    var kek = await kekFromRawBytes(secretBytes);
    var dek = await unwrapDEK(config.wrappedDekBiometric, config.wrappedDekBiometricIv, kek);

    notes = await decryptAllNoteRecords(dek);
    vaultKey = dek;
    recoveryAvailable = !!config.recoveryEnabled;
    biometricAvailable = true;
    await loadVaultMeta(dek, config);
    purgeExpiredTrash();
    logActivity('unlock', { method: 'biometric' });
    completeUnlock();
  } catch (err) {
    if (btn) { btn.disabled = false; btn.textContent = 'Unlock with Biometrics'; }
    if (!silent) errEl.textContent = 'Biometric unlock failed or was cancelled. Use your password instead.';
  }
}

function completeUnlock() {
  playUnlockAnimation(function () {
    $('#app-shell').hidden = false;
    $('#app-shell').classList.add('revealing');
    setTimeout(function () { $('#app-shell').classList.remove('revealing'); }, 260);
    selectedNoteId = null;
    if (recoveryModeActive) {
      currentTab = 'settings';
      changePasswordOpen = true;
    } else {
      currentTab = 'notes';
    }
    renderApp();
    if (recoveryModeActive) showToast('Recovery successful — set a new master password below', 'info');
    startIdleTimer();
    icons();
  });
}

function playUnlockAnimation(onDone) {
  if (reducedMotion) {
    $('#lock-screen').classList.add('hidden');
    onDone();
    return;
  }
  var bolt = $('#bolt-line'), card = $('#lock-card');
  bolt.classList.add('retract');
  setTimeout(function () {
    card.classList.add('unlocking');
    setTimeout(function () {
      $('#lock-screen').classList.add('hidden');
      bolt.classList.remove('retract');
      card.classList.remove('unlocking');
      var submitBtn = $('#unlock-form button[type="submit"]');
      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.textContent = lockMode === 'setup' ? 'Create Vault' : (lockMode === 'recovery' ? 'Unlock with Recovery Key' : 'Unlock');
      }
      onDone();
    }, 220);
  }, 380);
}

/* ============================================================
   LOCK VAULT
   ============================================================ */
function lockVault(reason) {
  flushPendingSave(true);
  var prevNote = selectedNoteId ? findNote(selectedNoteId) : null;
  cleanupIfBlank(prevNote);
  var keyAtLockTime = vaultKey;
  if (keyAtLockTime) logActivity('lock', { reason: reason || 'manual' }, keyAtLockTime);
  stopIdleTimer();
  vaultKey = null;
  notes = [];
  folders = [];
  activityLog = [];
  selectedNoteId = null;
  openTagPopoverNoteId = null;
  mobileShowEditor = false;
  changePasswordOpen = false;
  recoveryModeActive = false;
  selectMode = false;
  selectedNoteIds = [];
  currentFolderId = 'all';
  activeTagFilters = [];
  var notesPanelEl = $('.notes-panel');
  if (notesPanelEl) notesPanelEl.classList.remove('mobile-show-editor');
  $('#app-shell').hidden = true;
  $('#lock-screen').classList.remove('hidden');
  renderLockScreen('unlock');
}

/* A single window-blur listener covers both switching browser tabs and
   switching away to another application — visibilitychange alone would miss the latter. */
window.addEventListener('blur', function () {
  if (prefs.lockOnBlur && vaultKey) lockVault('blur');
});

/* Idle auto-lock */
function startIdleTimer() {
  stopIdleTimer();
  if (prefs.autoLockMinutes === 'never') return;
  var ms = parseInt(prefs.autoLockMinutes, 10) * 60000;
  idleTimer = setTimeout(function () { lockVault('idle'); showToast('Vault locked after inactivity', 'info'); }, ms);
}
function stopIdleTimer() { if (idleTimer) clearTimeout(idleTimer); idleTimer = null; }
function resetIdleTimer() { if (vaultKey) startIdleTimer(); }
['mousemove', 'keydown', 'click', 'scroll', 'touchstart'].forEach(function (ev) {
  document.addEventListener(ev, function () { if (vaultKey) resetIdleTimer(); }, { passive: true });
});

/* ============================================================
   NOTES LIST
   ============================================================ */
function visibleNotes() {
  var q = searchQuery.trim().toLowerCase();
  var list = notes.filter(function (n) { return !n.deleted; });
  if (currentFolderId === 'none') {
    list = list.filter(function (n) { return !n.folderId; });
  } else if (currentFolderId !== 'all') {
    list = list.filter(function (n) { return n.folderId === currentFolderId; });
  }
  if (activeTagFilters.length) {
    list = list.filter(function (n) {
      return (n.tags || []).some(function (t) { return activeTagFilters.indexOf(t.label) !== -1; });
    });
  }
  if (q) {
    list = list.filter(function (n) {
      var text = (n.title || '') + ' ' + stripHtml(n.body || '') + ' ' + (n.tags || []).map(function (t) { return t.label; }).join(' ');
      return text.toLowerCase().indexOf(q) !== -1;
    });
  }
  list.sort(function (a, b) {
    if (!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
    if (sortMode === 'created') return (b.createdAt || 0) - (a.createdAt || 0);
    if (sortMode === 'title') {
      var at = (a.title || '').trim().toLowerCase(), bt = (b.title || '').trim().toLowerCase();
      if (!at && bt) return 1;
      if (at && !bt) return -1;
      return at.localeCompare(bt);
    }
    return (b.modifiedAt || 0) - (a.modifiedAt || 0);
  });
  return list;
}
function allTagLabels() {
  var seen = {}, labels = [];
  notes.forEach(function (n) {
    if (n.deleted) return;
    (n.tags || []).forEach(function (t) {
      if (!seen[t.label]) { seen[t.label] = true; labels.push(t.label); }
    });
  });
  return labels;
}
function renderNotesList() {
  renderFolderBar();
  renderTagFilterBar();
  renderBulkActionBar();

  var container = $('#notes-list');
  var scrollTop = container.scrollTop;
  var list = visibleNotes();

  if (notes.filter(function (n) { return !n.deleted; }).length === 0) {
    container.innerHTML = '<div class="empty-state"><i data-lucide="file-text"></i><p>No notes yet. Tap the + button to create your first note.</p></div>';
    icons();
    return;
  }
  if (list.length === 0) {
    container.innerHTML = '<div class="empty-state"><i data-lucide="search-x"></i><p>No notes match your search or filters.</p></div>';
    icons();
    return;
  }

  container.innerHTML = list.map(function (n) {
    var title = n.title && n.title.trim() ? escapeHtml(n.title) : 'Untitled note';
    var titleClass = n.title && n.title.trim() ? '' : ' untitled';
    var snippet = escapeHtml(stripHtml(n.body || '').slice(0, 140)) || 'No additional text';
    var tagsHtml = (n.tags || []).slice(0, 3).map(function (t) {
      return '<span class="mini-tag tag-' + t.colorId + '">' + escapeHtml(t.label) + '</span>';
    }).join('');
    var folder = n.folderId ? findFolder(n.folderId) : null;
    var folderHtml = folder ? '<span class="mini-folder"><i data-lucide="folder"></i>' + escapeHtml(folder.name) + '</span>' : '';
    var checked = selectedNoteIds.indexOf(n.id) !== -1;
    return (
      '<div class="note-item' + (n.id === selectedNoteId ? ' active' : '') + (n.pinned ? ' pinned' : '') + (selectMode ? ' select-mode' : '') + '" data-id="' + n.id + '" tabindex="0" role="button" aria-label="Open note ' + title + '">' +
        (selectMode ? '<span class="note-item-check"><input type="checkbox" class="note-select-checkbox" data-id="' + n.id + '"' + (checked ? ' checked' : '') + '></span>' : '') +
        '<div class="note-item-body">' +
          '<div class="note-item-top">' +
            '<span class="note-item-title' + titleClass + '">' + title + '</span>' +
            '<span class="pin-indicator"><i data-lucide="pin"></i></span>' +
          '</div>' +
          '<div class="note-item-snippet">' + snippet + '</div>' +
          (tagsHtml || folderHtml ? '<div class="note-item-tags">' + folderHtml + tagsHtml + '</div>' : '') +
          '<div class="note-item-meta"><span>' + formatDate(sortMode === 'created' ? n.createdAt : n.modifiedAt) + '</span></div>' +
        '</div>' +
      '</div>'
    );
  }).join('');
  container.scrollTop = scrollTop;
  icons();

  $all('.note-item', container).forEach(function (el) {
    on(el, 'click', function (e) {
      if (selectMode) {
        if (e.target.classList.contains('note-select-checkbox')) return; // checkbox handles its own toggle
        toggleNoteSelected(el.getAttribute('data-id'));
        return;
      }
      selectNote(el.getAttribute('data-id'));
    });
    on(el, 'keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        if (selectMode) toggleNoteSelected(el.getAttribute('data-id'));
        else selectNote(el.getAttribute('data-id'));
      } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        var items = $all('.note-item', container);
        var idx = items.indexOf(el);
        var next = items[e.key === 'ArrowDown' ? idx + 1 : idx - 1];
        if (next) next.focus();
      }
    });
  });
  $all('.note-select-checkbox', container).forEach(function (cb) {
    on(cb, 'change', function () { toggleNoteSelected(cb.getAttribute('data-id')); });
  });
}

  range.setEnd(ctx.node, ctx.endOffset);

  a.href = '#';
  a.setAttribute('contenteditable', 'false');

  if (note) {
    recordEditorHistoryChange(note, bodyEl, beforeSelection);
    note.body = serializeEditorBody(bodyEl);
    scheduleSave(note);
    renderLinkedNotes(note, bodyEl);
  }
}

  wikiAutocompleteState.index = (wikiAutocompleteState.index + delta + wikiAutocompleteState.items.length) % wikiAutocompleteState.items.length;

function makeWikiLinkCaretMarker() {

}
function replaceLegacyWikiCaretPads(container) {

    pad.parentNode.replaceChild(makeWikiLinkCaretMarker(), pad);
    changed = true;
  });

}
function ensureWikiLinkCaretMarkers(container) {

    var prev = a.previousSibling;

    var nextHasMarker = next && next.nodeType === Node.TEXT_NODE && next.nodeValue.indexOf('\u200B') !== -1;

      var title = match[1].trim();
      var target = findNoteByTitle(title);
      if (target && !target.deleted && target.id !== (selectedNoteId || '')) {
        var a = document.createElement('a');
        a.className = 'wiki-link';
        a.href = '#';
        a.setAttribute('contenteditable', 'false');
        a.setAttribute('data-note-id', target.id);
        a.textContent = '[[' + (target.title || title) + ']]';
        frag.appendChild(a);

      return;

    a.classList.remove('wiki-link-missing');

    acceptNode: function (node) {

      } else if (!target2 && title && !seen['missing:' + title.toLowerCase()]) {

    : versions.map(function (v, i) {

        return '<div class="version-row">' +

    '<div class="modal-backdrop" id="version-backdrop">' +
      '<div class="modal" role="dialog" aria-modal="true" style="max-width:460px;">' +
        '<h3 class="modal-title">Version History</h3>' +

/* Re-highlights code blocks. Only called at safe moments (initial render, blur,

}

function computeWordCountText(body) {

}

/* Image insertion: photos from a phone camera can be 5-10MB+, which would blow

   re-encoded as JPEG before being embedded, regardless of source format. */
var pendingImageTarget = null;
var selectedImageEl = null;
var selectedImageBodyEl = null;

function getImageResizeMode(img) {
  if (!img) return 'auto';
  var width = (img.style && img.style.width) || '';
  if (!width) return 'auto';
  var match = width.match(/^(25|50|75|100)%$/);
  return match ? match[1] : 'custom';
}
function updateImageResizeButton() {
  var btn = $('#editor-image-resize-btn');

  btn.classList.toggle('active-state', !!selectedImageEl);
}
function positionImageResizePopover() {
  var pop = $('#image-resize-popover');
  if (!pop || !selectedImageEl) return;
  var r = selectedImageEl.getBoundingClientRect();
  var popRect = pop.getBoundingClientRect();
  var left = Math.min(Math.max(12, r.left), Math.max(12, window.innerWidth - popRect.width - 12));
  var above = r.top - popRect.height - 8;
  var top = above >= 12 ? above : Math.min(window.innerHeight - popRect.height - 12, r.bottom + 8);
  pop.style.left = left + 'px';
  pop.style.top = Math.max(12, top) + 'px';
}

  var pop = $('#image-resize-popover');

  selectedImageEl = img;

    '<button type="button" class="image-resize-btn reset" data-image-size="auto" aria-label="Reset image size">Auto</button>';
